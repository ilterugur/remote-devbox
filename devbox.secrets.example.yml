---
# ============================================================================
#  Secrets for remote-devbox. Copy to devbox.secrets.yml (gitignored) and fill in.
#
#    cp devbox.secrets.example.yml devbox.secrets.yml
#
#  devbox.yml never contains a credential — it contains the NAME of one. Anything
#  here is written to ansible/.generated/secrets.yml at 0600 and loaded by the
#  playbook with no_log. Flat NAME: value pairs only.
# ============================================================================

# Reusable, NON-ephemeral auth key: https://login.tailscale.com/admin/settings/keys
TAILSCALE_AUTHKEY: "tskey-auth-REPLACE_ME"

# Referenced from devbox.yml as memory.instances.<name>.api_key_env
OPENROUTER_API_KEY: "sk-or-REPLACE_ME"
