---
# The reaper's containment lives in two places: the script decides WHAT to kill
# (covered by scripts/test_agent_rc_reap.py), and these units decide whether it
# can run at all. The assertions below pin the settings whose absence would make
# the timer look healthy while doing nothing, or let it reach past its job.
- name: Verify worktree-orphan reaper unit rendering
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    devbox_remote_control:
      reap: { enabled: true, interval_sec: 900, grace_sec: 900 }

  tasks:
    - name: Render and verify the reaper unit and timer in an isolated directory
      block:
        - name: Create an isolated render directory
          ansible.builtin.tempfile:
            state: directory
            prefix: remote-devbox-rc-reap-policy-
          register: render_dir

        - name: Render the reaper unit and timer
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/agent_remote/templates/agent-rc-reap.{{ item }}.j2"
            dest: "{{ render_dir.path }}/agent-rc-reap.{{ item }}"
            mode: "0600"
          loop: [service, timer]

        - name: Read the reaper unit
          ansible.builtin.slurp:
            src: "{{ render_dir.path }}/agent-rc-reap.service"
          register: reap_unit

        - name: Read the reaper timer
          ansible.builtin.slurp:
            src: "{{ render_dir.path }}/agent-rc-reap.timer"
          register: reap_timer

        # The reaper only kills what it saw orphaned on an EARLIER pass, so the
        # sighting record has to survive between firings. Without Preserve=yes
        # systemd deletes the runtime directory when the oneshot exits, every pass
        # starts empty, nothing ever ages into its grace, and the timer becomes a
        # silent no-op. This is the single assertion most worth having.
        - name: Assert the sighting state survives between sweeps
          ansible.builtin.assert:
            that:
              - "'RuntimeDirectory=agent-rc-reap' in reap_unit.content | b64decode"
              - "'RuntimeDirectoryPreserve=yes' in reap_unit.content | b64decode"
              - "'ReadWritePaths=/run/agent-rc-reap' in reap_unit.content | b64decode"
              - "'--state /run/agent-rc-reap/seen.json' in reap_unit.content | b64decode"

        - name: Assert the configured grace reaches the command line
          ansible.builtin.assert:
            that:
              - "'--grace-sec 900' in reap_unit.content | b64decode"

        # Signalling across uids is the only privilege this needs. A bounding set
        # that grew would hand a janitor the rest of root for no reason.
        - name: Assert the reaper keeps only the capability it needs
          ansible.builtin.assert:
            that:
              - "'CapabilityBoundingSet=CAP_KILL CAP_DAC_READ_SEARCH CAP_SYS_PTRACE' in reap_unit.content | b64decode"
              - "'ProtectSystem=strict' in reap_unit.content | b64decode"
              - "'NoNewPrivileges=yes' in reap_unit.content | b64decode"

        # hide_pids mounts /proc with hidepid; a hardened ProtectProc on top would
        # hide the very processes the sweep exists to find.
        - name: Assert the reaper can still see every process
          ansible.builtin.assert:
            that:
              - "'ProtectProc=default' in reap_unit.content | b64decode"

        - name: Assert the timer waits out boot and then runs at the configured interval
          ansible.builtin.assert:
            that:
              - "'OnUnitActiveSec=900s' in reap_timer.content | b64decode"
              - "'OnBootSec=10min' in reap_timer.content | b64decode"
              - "'Unit=agent-rc-reap.service' in reap_timer.content | b64decode"
      always:
        - name: Remove the isolated render directory
          ansible.builtin.file:
            path: "{{ render_dir.path }}"
            state: absent
          when: render_dir.path is defined
