---
# Codex Desktop owns a transient `codex-code-mode-host.service` and reconnects through
# its control socket. Provisioning a second app-server races that owner and fails with
# "control socket is already in use". The durable contract is therefore a drop-in on
# the desktop-owned unit: resource policy only, never a competing ExecStart.
- name: Verify codex code-mode host drop-in rendering
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_facts:
      getent_passwd:
        dev-a: ["x", "1004"]
    codex_row:
      user: dev-a
      resources:
        memory_high: "8G"
        memory_max: "12G"
        memory_swap_max: "1G"
        cpu_weight: 80
        io_weight: 80
        nice: 5
        oom_score_adjust: 300
        oom_policy: continue

  tasks:
    - name: Render and assert
      block:
        - name: Create an isolated render directory
          ansible.builtin.tempfile:
            state: directory
            prefix: remote-devbox-codex-unit-policy-
          register: render_dir

        - name: Render the code-mode host drop-in
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/agent_remote/templates/codex-code-mode-host.conf.j2"
            dest: "{{ render_dir.path }}/50-remote-devbox.conf"
            mode: "0600"
          vars:
            row: "{{ codex_row }}"

        - name: Read the code-mode host drop-in
          ansible.builtin.slurp:
            src: "{{ render_dir.path }}/50-remote-devbox.conf"
          register: codex_dropin

        - name: Assert the ceilings and the OOM hardening reach the unit file
          ansible.builtin.assert:
            that:
              - "'MemoryHigh=8G' in codex_dropin.content | b64decode"
              - "'MemoryMax=12G' in codex_dropin.content | b64decode"
              - "'MemorySwapMax=1G' in codex_dropin.content | b64decode"
              - "'OOMPolicy=continue' in codex_dropin.content | b64decode"
              - "'ManagedOOMPreference=avoid' in codex_dropin.content | b64decode"
              - "'TimeoutStopSec=30' in codex_dropin.content | b64decode"

        - name: Assert provisioning does not compete with the desktop-owned daemon
          ansible.builtin.assert:
            that:
              - "'ExecStart=' not in codex_dropin.content | b64decode"
              - "'Environment=CODEX_HOME' not in codex_dropin.content | b64decode"
              - "'codex app-server --remote-control' not in codex_dropin.content | b64decode"
              - "'User=' not in codex_dropin.content | b64decode"
              - "'Slice=' not in codex_dropin.content | b64decode"
      always:
        - name: Remove the isolated render directory
          ansible.builtin.file:
            path: "{{ render_dir.path }}"
            state: absent
          when: render_dir.path is defined
