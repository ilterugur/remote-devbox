---
- name: Verify oomd template rendering
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    devbox_host:
      oomd:
        enabled: true
        memory_pressure_limit: "60%"
        memory_pressure_duration_sec: 20
    devbox_developers:
      - user: dev-a
        resources: {}

  tasks:
    - name: Render and verify the slice drop-in in an isolated directory
      block:
        - name: Create an isolated render directory
          ansible.builtin.tempfile:
            state: directory
            prefix: remote-devbox-oomd-policy-
          register: render_dir

        - name: Render a developer slice drop-in
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/oomd/templates/slice-oomd.conf.j2"
            dest: "{{ render_dir.path }}/slice.conf"
            mode: "0600"

        - name: Read the rendered drop-in
          ansible.builtin.slurp:
            src: "{{ render_dir.path }}/slice.conf"
          register: slice_dropin

        - name: Assert the thresholds reach the rendered drop-in
          ansible.builtin.assert:
            that:
              - "'ManagedOOMSwap=kill' in slice_dropin.content | b64decode"
              - "'ManagedOOMMemoryPressure=kill' in slice_dropin.content | b64decode"
              - "'ManagedOOMMemoryPressureLimit=60%' in slice_dropin.content | b64decode"
              - "'ManagedOOMMemoryPressureDurationSec=20s' in slice_dropin.content | b64decode"
      always:
        - name: Remove the isolated render directory
          ansible.builtin.file:
            path: "{{ render_dir.path }}"
            state: absent
          when: render_dir.path is defined
