---
- name: Verify oomd user-manager policy rendering
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    devbox_host:
      oomd:
        enabled: true
        memory_pressure_limit: "35%"
        memory_pressure_duration_sec: 45

  tasks:
    - name: Render and verify the slice drop-in in an isolated directory
      block:
        - name: Create an isolated render directory
          ansible.builtin.tempfile:
            state: directory
            prefix: remote-devbox-oomd-policy-
          register: render_dir

        - name: Render a developer user-manager drop-in
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/oomd/templates/user-manager-oomd.conf.j2"
            dest: "{{ render_dir.path }}/user-manager.conf"
            mode: "0600"

        - name: Read the rendered drop-in
          ansible.builtin.slurp:
            src: "{{ render_dir.path }}/user-manager.conf"
          register: user_manager_dropin

        - name: Assert pressure monitoring stays in the UID-owned boundary
          ansible.builtin.assert:
            that:
              - "'[Service]' in user_manager_dropin.content | b64decode"
              - "'[Slice]' not in user_manager_dropin.content | b64decode"
              - "'ManagedOOMSwap=auto' in user_manager_dropin.content | b64decode"
              - "'ManagedOOMSwap=kill' not in user_manager_dropin.content | b64decode"
              - "'ManagedOOMMemoryPressure=kill' in user_manager_dropin.content | b64decode"
              - "'ManagedOOMMemoryPressureLimit=35%' in user_manager_dropin.content | b64decode"
              - "'ManagedOOMMemoryPressureDurationSec=45s' in user_manager_dropin.content | b64decode"
      always:
        - name: Remove the isolated render directory
          ansible.builtin.file:
            path: "{{ render_dir.path }}"
            state: absent
          when: render_dir.path is defined
