---
# The gate has more than one entry point, and the earlier version of this test only
# rendered the interactive launcher. That is exactly how the always-on Remote Control
# path shipped ungated while this file stayed green: agent-rc-run never sourced the
# wiring, so every build an always-on session started bypassed the shared flock.
# Assert BOTH entry points here, or the same gap reopens the next time one moves.
- name: Verify every agent entry point inherits the shared heavy-command gate
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    gate_env_path: .agent-profiles/codex-main/heavy-gate.env
    item:
      name: codex-main
      provider: codex
      user: dev-a
      heavy_job_gate_categories: [build, typecheck, generate]
      heavy_job_gate_wait_timeout_sec: 1800
      heavy_job_gate_warn_after_sec: 5
    devbox_developers:
      - user: dev-a
        heavy_job_gate: { enabled: true }
      - user: dev-b
        heavy_job_gate: { enabled: false }
      - user: dev-c
        heavy_job_gate: { enabled: true }
    devbox_agent_adapters:
      codex:
        config_env: CODEX_HOME
        bin_path: .local/bin/codex

  tasks:
    - name: Render and assert
      block:
        - name: Create an isolated render directory
          ansible.builtin.tempfile:
            state: directory
            prefix: remote-devbox-heavy-command-gate-policy-
          register: render_dir

        - name: Render the heavy-job gate environment
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/agent_profiles/templates/heavy-gate.env.j2"
            dest: "{{ render_dir.path }}/heavy-gate.env"
            mode: "0600"

        - name: Read the heavy-job gate environment
          ansible.builtin.slurp:
            src: "{{ render_dir.path }}/heavy-gate.env"
          register: gate_env

        - name: Assert the gate environment carries the shim path and this profile's policy
          ansible.builtin.assert:
            that:
              - >-
                'export PATH="/usr/local/lib/agent-devbox/heavy-command-gate:$PATH"'
                in gate_env.content | b64decode
              - >-
                'DEVBOX_BUN_KILL_GUARD="/usr/local/lib/agent-devbox/process-kill-guard.ts"'
                in gate_env.content | b64decode
              - "'DEVBOX_HEAVY_JOB_CATEGORIES=\"build,typecheck,generate\"' in gate_env.content | b64decode"
              - "'DEVBOX_HEAVY_JOB_WAIT_TIMEOUT_SEC=\"1800\"' in gate_env.content | b64decode"
              - "'DEVBOX_HEAVY_JOB_WARN_AFTER_SEC=\"5\"' in gate_env.content | b64decode"

        - name: Render the agent wrapper
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/agent_profiles/templates/agent-wrapper.sh.j2"
            dest: "{{ render_dir.path }}/agent-wrapper"
            mode: "0755"

        - name: Read the agent wrapper
          ansible.builtin.slurp:
            src: "{{ render_dir.path }}/agent-wrapper"
          register: agent_wrapper

        # The launcher is the interactive counterpart of the unit files' TMPDIR: /tmp is a
        # tmpfs at half of RAM, so scratch written there is unreclaimable memory.
        - name: Assert the interactive launcher sends temporary files to disk
          ansible.builtin.assert:
            that:
              - "'export TMPDIR=\"/var/tmp/devbox-scratch/dev-a\"' in agent_wrapper.content | b64decode"

        - name: Assert the interactive launcher sources the gate after mise modifies PATH
          ansible.builtin.assert:
            that:
              - "gate_env_path in agent_wrapper.content | b64decode"
              - >-
                (agent_wrapper.content | b64decode).rfind('mise activate bash --shims')
                < (agent_wrapper.content | b64decode).rfind(gate_env_path)
              - "'[ -f \"$HEAVY_GATE_ENV\" ] && . \"$HEAVY_GATE_ENV\"' in agent_wrapper.content | b64decode"

        # The regression this file exists for. These are plain scripts rather than
        # templates, so they are read straight from the repo. Every script that starts an
        # agent belongs in this list: the gate reaching only some of them is precisely how
        # it stayed inert while looking installed. agent-rc-resume-exec matters most on a
        # box that restarts or OOMs — it is what brings nearly every session back.
        - name: Read each script that starts an agent
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../scripts/{{ script }}"
          loop:
            - agent-rc-run.sh
            - agent-rc-resume-exec.sh
          loop_control:
            loop_var: script
          register: agent_entry_scripts

        - name: Assert every agent entry point sources the gate after mise modifies PATH
          ansible.builtin.assert:
            that:
              - "'heavy-gate.env' in entry.content | b64decode"
              - >-
                (entry.content | b64decode).rfind('mise activate bash --shims')
                < (entry.content | b64decode).find('heavy-gate.env')
            fail_msg: >-
              scripts/{{ entry.script }} must source the profile's heavy-gate.env after mise
              activation. Without it every build the sessions it starts runs bypasses the
              shared heavy-job slot.
          loop: "{{ agent_entry_scripts.results }}"
          loop_control:
            loop_var: entry
            label: "{{ entry.script }}"

        # Same invariant for the memory wiring: per-profile, and the only thing that
        # separates two profiles pointed at different banks.
        - name: Assert every agent entry point sources the profile's memory wiring
          ansible.builtin.assert:
            that:
              - "'memory.env' in entry.content | b64decode"
            fail_msg: >-
              scripts/{{ entry.script }} must source the profile's memory.env. Without it a
              session it starts falls back to the per-HOME Hindsight config, which cannot
              tell two profiles pointed at different banks apart.
          loop: "{{ agent_entry_scripts.results }}"
          loop_control:
            loop_var: entry
            label: "{{ entry.script }}"

        # Opting out is the absence of the file, so the role has to both skip writing it
        # and remove one left behind by a previously enabled profile.
        - name: Read the agent profiles tasks
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../roles/agent_profiles/tasks/main.yml"
          register: agent_profiles_tasks

        - name: Assert a disabled profile ends up with no gate environment to source
          ansible.builtin.assert:
            that:
              - "'when: item.heavy_job_gate_enabled | default(true)' in agent_profiles_tasks.content | b64decode"
              - "'when: not (item.heavy_job_gate_enabled | default(true))' in agent_profiles_tasks.content | b64decode"

        # The roster is the only thing standing between "reorder what is already there"
        # and "hand the gate to anyone with a login shell". Measured 2026-09-05: a login
        # shell whose PATH never had the gate directory ran an ungated 13.8 GB build that
        # stalled the whole box, so the snippet now prepends too — and it must prepend
        # for exactly the developers whose gate is enabled, nobody else.
        - name: Render the heavy-command gate roster
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/agent_profiles/templates/heavy-gate-users.j2"
            dest: "{{ render_dir.path }}/heavy-gate-users"
            mode: "0600"

        - name: Read the roster and the profile.d snippet
          ansible.builtin.slurp:
            src: "{{ item_path }}"
          register: gate_path_files
          loop:
            - "{{ render_dir.path }}/heavy-gate-users"
            - "{{ playbook_dir }}/../roles/agent_profiles/templates/heavy-gate-path.sh.j2"
          loop_control:
            loop_var: item_path

        - name: Assert the roster names exactly the gate-enabled developers
          ansible.builtin.assert:
            that:
              - (gate_path_files.results[0].content | b64decode).split() == ['dev-a', 'dev-c']

        - name: Assert the snippet consults the roster and still reorders an existing entry
          ansible.builtin.assert:
            that:
              - "'/etc/agent-devbox/heavy-gate-users' in gate_path_files.results[1].content | b64decode"
              - "'__devbox_gate_listed' in gate_path_files.results[1].content | b64decode"
              - "'PATH=\"${__devbox_gate_dir}:${__devbox_new_path}\"' in gate_path_files.results[1].content | b64decode"
      always:
        - name: Remove the isolated render directory
          ansible.builtin.file:
            path: "{{ render_dir.path }}"
            state: absent
          when: render_dir.path is defined
