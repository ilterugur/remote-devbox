---
- name: Verify browser MCP wiring retires chrome-devtools and preserves foreign entries
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Reconcile a fixture config in an isolated directory
      block:
        - name: Create an isolated working directory
          ansible.builtin.tempfile:
            state: directory
            prefix: remote-devbox-browser-mcp-policy-
          register: work_dir

        - name: Seed a config carrying both browser entries and a foreign one
          ansible.builtin.copy:
            dest: "{{ work_dir.path }}/claude.json"
            mode: "0600"
            content: |
              {
                "mcpServers": {
                  "playwright": {"command": "npx", "args": ["-y", "@playwright/mcp@latest"]},
                  "chrome-devtools": {"command": "npx", "args": ["-y", "chrome-devtools-mcp@latest"]},
                  "some-other-server": {"command": "uvx", "args": ["some-other-server"]}
                },
                "unrelatedTopLevelKey": {"keep": true}
              }

        - name: Run the wiring script in attached mode
          ansible.builtin.command:
            argv:
              - "{{ playbook_dir }}/../roles/browser/files/wire-browser-mcp.py"
              - --config
              - "{{ work_dir.path }}/claude.json"
              - --cdp-endpoint
              - http://127.0.0.1:9222
          changed_when: false

        - name: Read the reconciled config
          ansible.builtin.slurp:
            src: "{{ work_dir.path }}/claude.json"
          register: reconciled

        - name: Assert the retirement and the preservation
          vars:
            cfg: "{{ reconciled.content | b64decode | from_json }}"
          ansible.builtin.assert:
            that:
              - "'chrome-devtools' not in cfg.mcpServers"
              - "'playwright' in cfg.mcpServers"
              - "'--cdp-endpoint' in cfg.mcpServers.playwright.args"
              - "'http://127.0.0.1:9222' in cfg.mcpServers.playwright.args"
              - "'some-other-server' in cfg.mcpServers"
              - cfg.mcpServers['some-other-server'].command == 'uvx'
              - cfg.unrelatedTopLevelKey.keep

        - name: Run the wiring script in shared-server mode
          ansible.builtin.command:
            argv:
              - "{{ playbook_dir }}/../roles/browser/files/wire-browser-mcp.py"
              - --config
              - "{{ work_dir.path }}/claude.json"
              - --playwright-url
              - http://127.0.0.1:9522/mcp
          changed_when: false

        - name: Read the config again
          ansible.builtin.slurp:
            src: "{{ work_dir.path }}/claude.json"
          register: shared

        - name: Assert the shared server replaces the spawned one
          vars:
            cfg: "{{ shared.content | b64decode | from_json }}"
          ansible.builtin.assert:
            that:
              - cfg.mcpServers.playwright.type == 'http'
              - cfg.mcpServers.playwright.url == 'http://127.0.0.1:9522/mcp'
              - "'command' not in cfg.mcpServers.playwright"
              - "'chrome-devtools' not in cfg.mcpServers"
              - "'some-other-server' in cfg.mcpServers"

        - name: Seed a second config for the self-launch (no failover) mode
          ansible.builtin.copy:
            dest: "{{ work_dir.path }}/claude-self-launch.json"
            mode: "0600"
            content: |
              {
                "mcpServers": {
                  "playwright": {"command": "npx", "args": ["-y", "@playwright/mcp@latest"]},
                  "chrome-devtools": {"command": "npx", "args": ["-y", "chrome-devtools-mcp@latest"]},
                  "some-other-server": {"command": "uvx", "args": ["some-other-server"]}
                },
                "unrelatedTopLevelKey": {"keep": true}
              }

        - name: Run the wiring script with neither --cdp-endpoint nor --playwright-url
          ansible.builtin.command:
            argv:
              - "{{ playbook_dir }}/../roles/browser/files/wire-browser-mcp.py"
              - --config
              - "{{ work_dir.path }}/claude-self-launch.json"
          changed_when: false

        - name: Read the self-launch reconciled config
          ansible.builtin.slurp:
            src: "{{ work_dir.path }}/claude-self-launch.json"
          register: reconciled_self_launch

        - name: Assert the self-launch entry and the retirement
          vars:
            cfg_self_launch: "{{ reconciled_self_launch.content | b64decode | from_json }}"
          ansible.builtin.assert:
            that:
              - "'chrome-devtools' not in cfg_self_launch.mcpServers"
              - "'playwright' in cfg_self_launch.mcpServers"
              - "'--browser' in cfg_self_launch.mcpServers.playwright.args"
              - "'chrome' in cfg_self_launch.mcpServers.playwright.args"
              - "'--headless' in cfg_self_launch.mcpServers.playwright.args"
              - "'--no-sandbox' in cfg_self_launch.mcpServers.playwright.args"

        - name: Render the shared server unit (failover on)
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/browser/templates/devbox-playwright-mcp.service.j2"
            dest: "{{ work_dir.path }}/unit-failover-on.service"
            mode: "0600"
          vars:
            devbox_browser:
              mcp_port: 9522
              failover: { enabled: true, chrome_user: dev-a, cdp_port: 9222 }

        - name: Read the rendered unit (failover on)
          ansible.builtin.slurp:
            src: "{{ work_dir.path }}/unit-failover-on.service"
          register: unit_failover_on

        - name: Assert the failover-on unit attaches to the shared CDP endpoint
          ansible.builtin.assert:
            that:
              - "'--port 9522' in unit_failover_on.content | b64decode"
              - "'--cdp-endpoint http://127.0.0.1:9222' in unit_failover_on.content | b64decode"
              - "'--browser' not in unit_failover_on.content | b64decode"
              - "'NODE_OPTIONS=--max-old-space-size=512' in unit_failover_on.content | b64decode"
              - "'OOMPolicy=continue' in unit_failover_on.content | b64decode"
              - "'/bin/bash -lc' in unit_failover_on.content | b64decode"

        - name: Render the shared server unit (failover off)
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/browser/templates/devbox-playwright-mcp.service.j2"
            dest: "{{ work_dir.path }}/unit-failover-off.service"
            mode: "0600"
          vars:
            devbox_browser:
              mcp_port: 9522
              failover: { enabled: false, chrome_user: dev-a, cdp_port: 9222 }

        - name: Read the rendered unit (failover off)
          ansible.builtin.slurp:
            src: "{{ work_dir.path }}/unit-failover-off.service"
          register: unit_failover_off

        - name: Assert the failover-off unit launches its own headless Chrome
          ansible.builtin.assert:
            that:
              - "'--port 9522' in unit_failover_off.content | b64decode"
              - "'--cdp-endpoint' not in unit_failover_off.content | b64decode"
              - "'--browser' in unit_failover_off.content | b64decode"
              - "'chrome' in unit_failover_off.content | b64decode"
              - "'--headless' in unit_failover_off.content | b64decode"
              - "'--no-sandbox' in unit_failover_off.content | b64decode"
              - "'NODE_OPTIONS=--max-old-space-size=512' in unit_failover_off.content | b64decode"
              - "'OOMPolicy=continue' in unit_failover_off.content | b64decode"
              - "'/bin/bash -lc' in unit_failover_off.content | b64decode"
      always:
        - name: Remove the isolated working directory
          ansible.builtin.file:
            path: "{{ work_dir.path }}"
            state: absent
          when: work_dir.path is defined
