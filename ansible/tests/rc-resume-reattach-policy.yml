---
# The reattach path is a chain across four files: the snapshotter is deployed, the
# monitor refreshes the map, the orchestrator reads it back, and the launcher hands
# it to the process. Break any link and a resumed session silently mints a second
# claude.ai card again -- which nothing else in the suite would catch.
- name: Verify the resume reattach wiring stays intact
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read the wiring that keeps a resumed session on its own card
      ansible.builtin.set_fact:
        role_tasks: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/agent_remote/tasks/main.yml') | from_yaml }}"
        monitor_src: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../scripts/agent-rc-monitor.sh') }}"
        resume_src: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../scripts/agent-rc-resume.sh') }}"
        exec_src: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../scripts/agent-rc-resume-exec.sh') }}"

    - name: Find the task that deploys the snapshotter
      ansible.builtin.set_fact:
        snapshot_deploy: "{{ item['ansible.builtin.copy'] }}"
      loop: "{{ role_tasks }}"
      loop_control:
        label: "{{ item.name | default('unnamed') }}"
      when:
        - item['ansible.builtin.copy'] is defined
        - item['ansible.builtin.copy'].dest | default('') == '/usr/local/bin/agent-rc-bridge-snapshot'

    - name: Assert the snapshotter is correctly deployed and driven from the monitor loop
      ansible.builtin.assert:
        that:
          - snapshot_deploy is defined
          - snapshot_deploy.src is search('scripts/agent-rc-bridge-snapshot\.py$')
          - snapshot_deploy.mode == '0755'
          - snapshot_deploy.owner == 'root'
          - snapshot_deploy.group == 'root'
          - monitor_src is search('/usr/local/bin/agent-rc-bridge-snapshot')
          # Match the actual invocation ("${SNAPSHOT}" "${ID}"), not just the
          # `[ -x "${SNAPSHOT}" ]` executability guard -- a bare ${SNAPSHOT}
          # reference is satisfied by the guard alone even if the call itself
          # were replaced with a no-op, so the assertion has to be about the call.
          - monitor_src is search('(?s)while tmux.*?\${SNAPSHOT}"\s+"\${ID}.*?done')
        fail_msg: >-
          the bridge identity is no longer captured while sessions live: the
          snapshotter must be deployed executable (mode 0755, owner root), and
          the monitor must call it from inside the tmux-alive loop so it runs
          every ~30s while a session is active; every resumed session without
          this wiring will mint a second claude.ai card

    - name: Assert the pointer is read back and handed to the resumed process
      ansible.builtin.assert:
        that:
          - "'bridge-map-' in resume_src"
          - "'CLAUDE_BRIDGE_REATTACH_SESSION' in exec_src"
          # A resumed session has to accept input from the phone. The CLI's own
          # helper sets outbound-only unless told otherwise, so an assignment here
          # would hand the user a card they cannot type into. Matching on the "="
          # keeps the prose in the surrounding comment from tripping this.
          - "'CLAUDE_BRIDGE_REATTACH_OUTBOUND_ONLY=' not in exec_src"
          # SEQ and GROUPING carry no trustworthy value after an OOM: the resumed
          # process has no way to know what sequence/grouping state the crashed
          # one was in, so assigning either would be a guess dressed up as fact.
          - "'CLAUDE_BRIDGE_REATTACH_SEQ=' not in exec_src"
          - "'CLAUDE_BRIDGE_REATTACH_GROUPING=' not in exec_src"
        fail_msg: >-
          the resumed session no longer reattaches to its own card, or does so
          in a way that blocks phone input (OUTBOUND_ONLY) or fabricates
          post-OOM sequence/grouping state that cannot be trusted (SEQ/GROUPING)
