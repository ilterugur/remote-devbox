---
# Container-based smoke test for the parts of the playbook that do not need a real
# kernel: account creation, isolation, git identities and agent profile layout.
#
# It is deliberately NOT a substitute for a real box. cgroup delegation, rootless
# container engines, /proc hidepid and xRDP all behave differently (or not at all)
# inside a container — those are covered by running against a real Ubuntu host.
#
#   pip install 'molecule' 'molecule-plugins[docker]'
#   cd ansible && molecule test
driver:
  name: docker

platforms:
  - name: devbox-molecule
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      # Molecule writes an ephemeral ansible.cfg outside the repository. Anchor
      # the roles path to the detected project directory instead of that cache.
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    group_vars:
      all:
        # The image is 24.04, so the platform gate has to be told this is on purpose.
        devbox_allow_unsupported_platform: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
