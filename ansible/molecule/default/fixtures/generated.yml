---
# A fixture, not a real config: placeholders only, and small enough to reason about.
# Mirrors what `devbox plan --write-vars` emits.
devbox_config_version: 3
devbox_platform:
  distribution: ubuntu
  version: "26.04"
  architecture: amd64
devbox_runtimes: {}
devbox_host:
  swap_size: 1G
  zram:
    enabled: false
    percent: 50
    algo: zstd
    priority: 100
  locales:
    - en_US.UTF-8
  mosh: false
  eternal_terminal: false
  harden_ssh: false
  # /proc is not remountable inside an unprivileged container.
  hide_pids: false
  github_cli: true
  umask: "077"
devbox_operator:
  user: devbox-admin
  ssh_authorized_keys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFIXTUREPLACEMEFIXTUREPLACEMEFIXTUREPL operator@fixture"
  private_key_path: "~/.ssh/id_ed25519"
devbox_network:
  tailscale:
    enabled: false
  ssh:
    exposure: public_only
devbox_container:
  default_engine: none
  install_engines:
    - none
devbox_shared_services:
  enabled: false
  engine: system-docker
# A Remote Control unit needs a logged-in agent and a real tmux session, neither of
# which a container can offer. The scenario asserts the off path; the on path is
# verified on a real box.
devbox_remote_control:
  enabled: false
  autorestart: {enabled: true, restart_sec: 10, burst: 10, interval: 600}
  resume:
    on_boot: true
    lookback_h: 12
    max_concurrent: 2
    settle_sec: 20
    min_free_mb: 1200
    max_attempts: 3
    timeout_sec: 1800
    skip_workflow_warning: true
devbox_rc_units: []

devbox_developers:
  - user: dev-a
    adopt_existing: false
    login_ssh_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFIXTUREPLACEMEFIXTUREPLACEMEFIXTUREPL dev-a@fixture"
    resources: {}
    container_engine: null
    git_identities:
      work:
        name: "Dev A"
        email: "dev-a@example.com"
        github_user: null
      personal:
        name: "Dev A"
        email: "dev-a@personal.example"
        github_user: null
    # Convenience for verify.yml: subelements needs a list, not a mapping.
    git_identity_names: [work, personal]
    default_git_identity: work
    agent_profiles: {}
    default_agent_profile: null
    memory:
      enabled: false
      default_space: null
      instances: {}
      spaces: {}
    desktop:
      enabled: false
      environment: xfce
      transport: xrdp
      tailscale_only: true
      idle_logout_minutes: null
    projects: []
  - user: dev-b
    adopt_existing: false
    login_ssh_keys: []
    resources: {}
    container_engine: null
    git_identities: {}
    git_identity_names: []
    default_git_identity: null
    agent_profiles: {}
    default_agent_profile: null
    memory:
      enabled: false
      default_space: null
      instances: {}
      spaces: {}
    desktop:
      enabled: false
      environment: xfce
      transport: xrdp
      tailscale_only: true
      idle_logout_minutes: null
    projects: []
