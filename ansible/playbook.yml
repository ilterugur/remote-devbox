---
# The playbook consumes ONLY the generated variables. devbox.yml is parsed, validated,
# defaulted and normalized by `devbox plan --write-vars`; by the time Ansible runs, every
# decision has already been made. That is why no role here contains a `| default(...)`
# policy choice — a missing key is a bug in the generator, not a silent fallback.
#
#   devbox plan --write-vars          # regenerate .generated/{all,secrets}.yml
#   ansible-playbook -i inventory.ini playbook.yml
#
- name: Provision the remote dev box
  hosts: devbox
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/.generated/all.yml"
    - "{{ playbook_dir }}/.generated/secrets.yml"

  pre_tasks:
    - name: First-run reminder (connected as root)
      ansible.builtin.debug:
        msg: >-
          Connected as root (first-run mode). After this run, root SSH login is disabled —
          set `ansible_user={{ devbox_operator.user }}` in inventory.ini for every later
          run, or re-runs will fail to connect.
      when: ansible_user | default('') == 'root'
      tags: [always]

  # Role tags target one thing on an already-provisioned box, e.g.
  #   ansible-playbook playbook.yml --tags developers   # reconcile accounts + limits
  #   ansible-playbook playbook.yml --tags runtime      # bump a toolchain version
  roles:
    # Read-only gate: platform, capacity, account adoption, port conflicts.
    - { role: preflight, tags: [preflight] }

    - { role: base, tags: [base] }

    # The operator must exist and be able to sudo BEFORE security touches sshd.
    - { role: operator, tags: [base, operator] }
    - { role: security, tags: [security] }

    - role: tailscale
      tags: [tailscale]
      when: devbox_network.tailscale.enabled | bool

    # After tailscale so their firewall rules can scope to the tailscale0 interface.
    - role: mosh
      tags: [mosh]
      when: devbox_host.mosh | bool
    - role: et
      tags: [et]
      when: devbox_host.eternal_terminal | bool

    - { role: runtime, tags: [runtime, mise] }

    # Accounts, isolation and the per-developer resource slice.
    - { role: developers, tags: [developers] }
    - { role: resource_limits, tags: [developers, resources] }
    - { role: oomd, tags: [developers, resources, oomd] }

    # Git identities, agent logins and working copies. Independent of each other by
    # design: a project picks an identity AND an agent, and neither implies the other.
    - { role: git_identities, tags: [developers, git] }
    - { role: agent_profiles, tags: [agents] }

    # The curated config tree each developer's agent reads. After agent_profiles so
    # the homes and profile directories it writes into already exist.
    - role: agent_config
      tags: [agents, agent_config]
      when: devbox_developers | selectattr('agent_config') | list | length > 0

    - { role: projects, tags: [projects] }

    # Always-on Remote Control servers. After projects: a session cannot enter a
    # working copy that has not been cloned yet.
    - role: agent_remote
      tags: [agents, rc]
      when: devbox_remote_control.enabled | bool

    # Headless Chrome and the browser MCP servers, for the developers that asked.
    # After agent_config: that role rewrites the same ~/.claude tree, and the MCP
    # entries must survive it rather than race it.
    - role: browser
      tags: [browser]
      when:
        - devbox_browser.enabled | bool
        - devbox_developers | selectattr('browser') | list | length > 0

    # Rootless engines, per developer. Installed after projects so the engine map can
    # name every project it resolves.
    - { role: containers, tags: [containers] }

    # Long-term agent memory. After agent_profiles: it wires each profile to its bank.
    - { role: memory, tags: [memory] }

    # Optional per-developer graphical session. Last: it asserts the SSH hardening the
    # security role established is still in place before handing out PAM passwords.
    - { role: desktop, tags: [desktop] }

    # App configs ride the sync disk, so they come after the accounts and home dirs
    # exist. The role never makes a destructive choice — see roles/app_configs.
    - role: app_configs
      tags: [app_configs, bridge]
      when: devbox_developers | selectattr('app_configs.enabled') | list | length > 0

    # Two-way sync for the developers on the syncthing engine. With the tailnet up:
    # its listener binds the tailscale address only.
    - role: syncthing
      tags: [syncthing, bridge]
      when: devbox_developers | selectattr('file_bridge.engine', 'equalto', 'syncthing') | list | length > 0

    # Last, so the box CLI describes the box as every earlier role left it.
    - { role: box_cli, tags: [cli, always] }

    # Opt-in only: `devbox apply prune` (or --tags prune). Removes what devbox.yml no
    # longer declares, and asks before it does. `never` keeps it out of a full run.
    - { role: prune, tags: [prune, never] }

  post_tasks:
    - name: Next steps
      ansible.builtin.debug:
        msg: >-
          Provisioned {{ devbox_developers | length }} developer account(s):
          {{ devbox_developers | map(attribute='user') | join(', ') }}. Each can now
          `ssh <user>@<box>` with the keys declared in devbox.yml.
      tags: [always]
