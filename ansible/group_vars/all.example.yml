---
# ============================================================================
#  claude-devbox configuration  —  copy to all.yml (gitignored) and edit.
#
#    cp group_vars/all.example.yml group_vars/all.yml
#
#  v2 model: each PROFILE is its own Linux user — isolated $HOME, SSH key, git
#  identity, Claude login, and always-on Remote Control servers. Runtimes are
#  installed once (via mise) and shared. The one manual step is a `/login` per
#  profile (Remote Control needs interactive OAuth) — see docs/multi-account.md.
# ============================================================================

# ── Admin user (Ansible connects as this; has sudo). NOT a Claude profile. ────
operator_user: admin
operator_ssh_pubkey: "ssh-ed25519 AAAA...REPLACE_ME you@client"
operator_private_key_path: "~/.ssh/id_ed25519" # for the pre-hardening probe

# ── Box tuning ────────────────────────────────────────────────────────────────
swap_file: /swapfile
swap_size: 4G # bump (e.g. 8G/12G) so heavy builds swap instead of getting OOM-killed

# zram: compressed RAM swap, used before the disk swapfile (higher priority). Gives
# memory-heavy builds extra effective RAM at ~2-3x compression so they finish under
# pressure instead of triggering the OOM killer — without upgrading the box.
# zram_enabled: true
# zram_percent: 50    # zram size = 50% of RAM
# zram_algo: zstd
# zram_priority: 100  # > disk swap (-1): zram is used first

# ── Per-server resource limits (systemd cgroup) ───────────────────────────────
# Applied to every always-on Remote Control server unit, so a runaway build is
# confined to its own cgroup and can never freeze the box or your interactive
# shell. Empty string = no limit for that knob. Override per-server by adding a
# `limits:` map to a server entry under `servers:`.
# rc_limits:
#   memory_high: "5G"     # soft: kernel reclaims/swaps past this (slows, no kill)
#   memory_max: "6G"      # hard RAM cap; excess spills to swap, not the host
#   memory_swap_max: ""   # cap on swap for this unit ("" = system swap)
#   cpu_weight: 80        # relative CPU share under contention (<100 yields to shells)
#   cpu_quota: ""         # absolute cap, e.g. "300%" = 3 of 4 cores ("" = uncapped)
#   io_weight: 80
#   nice: 5               # build niceness (>0 = lower priority than interactive work)
#   oom_score_adjust: 300 # if the host ever OOMs, kill builds first, not your shell
#
# Build memory caps injected into every RC server's environment (per-server
# override: `build_env:` on a server entry):
# rc_build_env:
#   NODE_OPTIONS: "--max-old-space-size=2048"

# ── Self-heal + crash-aware session resume (ON by default) ────────────────────
# Each always-on Remote Control server runs as a monitored process that systemd
# auto-restarts on ANY death — OOM kill, manual kill, or crash — in seconds. (A
# plain oneshot unit goes to "failed (oom-kill)" and STAYS down; the monitor lets
# systemd track liveness and restart it.) After a restart, a companion orchestrator
# scans the project's worktrees for sessions that were interrupted and brings each
# one back: resumed from disk (full conversation), re-registered on the phone, and
# — for any Workflow that was running when killed — resumed from its on-disk journal
# so the completed agents replay from cache and only the aborted tail re-runs.
# Completed workflows are never re-run. The resumed agent is told (via a system
# prompt) that this was an automated host event, so it continues seamlessly in the
# conversation's own language instead of posting "No response requested.".
#
# Safe by design: idempotent (won't double-resume a live session), throttled
# (rc_resume_max_concurrent at a time + a free-RAM gate, so recovery can't re-OOM
# the box), and quarantined (a session that keeps crashing is skipped after
# rc_resume_max_attempts within an hour, avoiding an OOM-restart loop). Worktrees
# and transcripts are read, never modified. Override any knob here:
# rc_autorestart: true            # false = legacy oneshot (stays down after OOM)
# rc_restart_sec: 10
# rc_resume_on_boot: true         # false = self-heal only, no auto-resume
# rc_resume_lookback_h: 12        # only resume sessions active within this window
# rc_resume_max_concurrent: 2     # sessions booting at once (OOM guard)
# rc_resume_min_free_mb: 1200     # wait for this much free RAM before next launch
# rc_resume_max_attempts: 3       # quarantine after N resumes within an hour
# Persists per-profile "workflows may use many agents/tokens" consent so resumed
# workflows continue without a prompt (only suppresses that warning — does NOT
# bypass edit/bash permissions). Defaults on when rc_resume_on_boot is on:
# rc_resume_skip_workflow_warning: true

# ── Private networking ────────────────────────────────────────────────────────
# Tailscale gives the box a private tailnet address (recommended: the dashboard,
# Hindsight exposure, and mosh/et all scope their access to it). Set to false to skip
# Tailscale entirely: then no tailscale_authkey is needed, the tailscale/et roles are
# skipped, mosh defaults OFF (forcing it on opens its UDP range publicly), Hindsight
# stays loopback-only, and you connect over the box's public host with your own
# firewall/VPN. Default: true.
tailscale_enabled: true
# Use a REUSABLE, NON-ephemeral key (https://login.tailscale.com/admin/settings/keys).
# Only needed when tailscale_enabled is true.
tailscale_authkey: "tskey-auth-REPLACE_ME"
# Host the `devbox-*` ssh aliases (mosh / plain ssh / VS Code / Zed) connect to, set
# by gen-editor-config.py. Pin the box's Tailscale IP (or MagicDNS name) here: mosh's
# UDP range is opened on tailscale0 ONLY, so connecting over the public IP fails with
# "Nothing received from server on UDP port". Provisioning still uses inventory.ini's
# ansible_host (the public IP). Leave unset to use the public IP for connect too.
#connect_host: "100.x.y.z"

# ── Runtimes (installed ONCE via mise, shared by all profiles) ────────────────
#  Tools resolve on every profile's PATH — including Claude's non-interactive
#  Bash tool — via /opt/mise/shims. Set a version, "lts", or "latest".
runtimes:
  node: "lts"
  python: "3.12"
  bun: "latest"
  uv: "latest"

# ── Profiles ──────────────────────────────────────────────────────────────────
#  Each profile = one Linux user = one Claude account = one git identity.
#  IMPORTANT — read docs/multi-account.md: use separate profiles only for
#  accounts you SEPARATELY and LEGITIMATELY pay for. Not for dodging rate limits.
profiles:
  - user: work # Linux username for this profile
    git_name: "Your Name"
    git_email: "you@work.example"
    # sudo: true   # opt this profile into passwordless (NOPASSWD) full sudo on the box.
                  # Default false: profiles are unprivileged for isolation. Flipping it
                  # back to false (or removing it) revokes sudo on the next playbook run.
    # An ed25519 SSH key is generated at /home/work/.ssh/id_ed25519 — add the
    # printed PUBLIC key to THIS profile's GitHub account (docs/multi-project.md).
    projects:
      - name: app
        repo: "git@github.com:work-org/app.git"
        branch: main
        install: true # run `bun install` after clone
        update: false # don't git-pull over Claude's local edits
        ports: [5173, 3000]
    servers: # always-on Remote Control servers (one per project) for the phone
      - project: app
        name: "Work · app" # title shown in the phone app
        spawn: worktree # worktree | same-dir | session
        capacity: 4 # Claude's flag default is 32; 4 is gentler on RAM

    # ── File bridge (optional) — see docs/file-bridge.md ──────────────────────
    # Lazy, read-only, full-depth windows onto client paths. The box mounts these
    # at /home/<user>/mnt/<label> while your client is online (gone when it sleeps).
    # Declared here; gen-editor-config.py propagates them to the client CLI config.
    # lazy_mounts:
    #   - { label: desktop,   path: "~/Desktop" }
    #   - { label: documents, path: "~/Documents" }
    # lazy_mount_on_connect: true   # auto `devbox mount up` when you connect
    #
    # Two-way sync "disk" (~/devbox/<user> <-> /home/<user>/sync). Drop folders in;
    # they stay on the box when the client is closed.
    # sync_disk: true
    # sync_engine: mutagen          # mutagen (default) | syncthing (provision: --tags syncthing)

  # - user: personal
  #   git_name: "Your Name"
  #   git_email: "you@personal.example"
  #   projects:
  #     - { name: side, repo: "git@github.com:me/side.git", branch: main }
  #   servers:
  #     - { project: side, name: "Personal · side", spawn: worktree, capacity: 2 }

# ── Claude config sync (skills / agents / commands / CLAUDE.md / mcp.json) ─────
#  Mirrors a CURATED, portable subset of your local ~/.claude and copies it into
#  EVERY profile's ~/.claude — never touching per-profile identity. Run
#  scripts/bundle-local-config.sh first. READ docs/config-sync.md.
sync_claude_config: true
claude_config_src: "{{ playbook_dir }}/../claude-config/shared"
claude_sync_settings: false # settings.json/hooks are machine-coupled; opt in

# ── Server-side headless browser use (ON by default) ─────────────────────────
#  Installs Google Chrome and wires Playwright + Chrome DevTools MCP into every
#  profile, so the agent on the box can drive a headless browser (navigate/click/
#  snapshot, console + network) and do deeper debugging (performance traces / Web
#  Vitals, throttling) — e.g. to test your web app. This is NOT
#  "Claude in Chrome" (that extension is client-side, on your client). For sites
#  that block datacenter IPs / throw CAPTCHAs you'd add a stealth/proxy layer
#  (Steel, Browserbase) on top. Set to false to skip Chrome + Playwright.
browser_automation: true

# Optional: attach the per-profile browser MCPs to a shared auto-failover CDP
# endpoint instead of each launching its own headless Chrome. When on, the box
# runs an HAProxy frontend on 127.0.0.1:{{ browser_cdp_port }} that routes to the
# operator's client browser (reverse SSH tunnel, primary) when reachable, else a
# local headless Chrome fallback service (backup). Client-side setup lives in the
# claude-devbox-setup skill. Default off → MCPs launch their own headless Chrome.
# Enabling requires per-profile browser MCPs to be wired to the tunnel (client-side
# setup handled by the claude-devbox-setup skill).
browser_remote_failover: false
browser_cdp_port: 9222
browser_fallback_chrome_port: 9422
browser_client_tunnel_port: 9322
browser_failover_chrome_user: "{{ profiles[0].user }}"

# ── Long-term agent memory: Vectorize Hindsight (ON by default) ────────────────
#  Wires Hindsight into Claude Code per profile: a UserPromptSubmit hook recalls
#  relevant memories into context; a Stop hook retains new facts after each response.
#  Runs per profile (uvx hindsight-embed daemon, port 9077). By DEFAULT only the LLM
#  extraction/recall calls leave the box (embeddings are local); if you enable a remote
#  embedder or reranker below, memory text is sent to that provider too. Memory is ONE
#  profile-wide bank (it remembers
#  you across ALL your projects — personal-assistant style), auto-tagged with
#  source/profile/project so you can filter it later via the agent_knowledge_* tools.
#  Requires `uv` in runtimes (the daemon runs via uvx). READ docs/memory.md.
hindsight_enabled: true
#  LLM provider for memory extraction/recall — generic, any Hindsight-supported provider
#  (openai | anthropic | gemini | groq | ollama | openrouter | openai-codex | claude-code | ...),
#  including a custom OpenAI-compatible endpoint via hindsight_llm_base_url.
#  Pick ONE block below. Keep the real secret in all.yml (gitignored) — never in this file.
#
#  ── OpenRouter (selected) — generic, OpenAI-compatible; needs an API key ──────
hindsight_llm_provider: "openrouter"
hindsight_llm_api_key: "REPLACE_ME"        # put the real sk-or-... key in all.yml ONLY
hindsight_llm_model: "openai/gpt-oss-20b"  # any model the provider serves ("" = provider default)
hindsight_llm_base_url: ""                  # optional custom OpenAI-compatible endpoint
#
#  ── OpenAI Codex (alternative, keyless) — uses the box's Codex / ChatGPT OAuth session, so
#     no API key and no per-token spend. Requires a logged-in Codex session on the box
#     (~/.codex/auth.json). To switch: comment the OpenRouter block above, uncomment this:
# hindsight_llm_provider: "openai-codex"
# hindsight_llm_api_key: ""                  # not needed — Codex uses its OAuth session
# hindsight_llm_model: "gpt-5.4-mini"
# hindsight_llm_base_url: ""
#
#  ── Splitting providers: LLM / embedder / reranker, each independent ──────────
#  The default LLM above is used by EVERY operation. On top of that you can override a
#  single operation, swap the embedder, or add a reranker — each can point at a different
#  provider. All optional; defaults keep one LLM + the local embedder + no reranker.
#  (After changing any of these on a live box, RESTART the daemon to pick them up.)
#
#  Per-operation LLM overrides — e.g. cheap retain, stronger reflect:
# hindsight_reflect_llm:
#   provider: "openrouter"
#   api_key: "REPLACE_ME"
#   model: "anthropic/claude-sonnet-4-6"
#   base_url: ""
# hindsight_retain_llm: {}
# hindsight_consolidation_llm: {}
#
#  Embedder — REMOTE example: text-embedding-3-small via OpenRouter's NATIVE embeddings
#  provider (Hindsight has a first-class "openrouter" provider — no base_url needed; reuse
#  your OpenRouter key). NOTE: a remote embedder sends memory text off the box (the default
#  local embedder does not). 1536-dim → changing the embedder on an existing bank needs a
#  re-embed/reset. For STRONGER Turkish, swap the model for "cohere/embed-v4.0" (also on
#  OpenRouter, multilingual-first).
# hindsight_embeddings:
#   provider: "openrouter"
#   api_key: "REPLACE_ME"                    # your OpenRouter sk-or-... key
#   model: "openai/text-embedding-3-small"
#
#  Embedder — LOCAL multilingual alternative (stays on the box; free; good for mixed TR+EN).
#  The onnx params don't fit the model/key/url shape, so set them raw via hindsight_extra_env
#  and leave hindsight_embeddings unset:
# hindsight_extra_env:
#   HINDSIGHT_API_EMBEDDINGS_PROVIDER: "onnx"
#   HINDSIGHT_API_EMBEDDINGS_ONNX_MODEL_ID: "intfloat/multilingual-e5-small"
#   HINDSIGHT_API_EMBEDDINGS_ONNX_DIMENSIONS: "384"
#   HINDSIGHT_API_EMBEDDINGS_ONNX_MAX_TOKENS: "512"
#   HINDSIGHT_API_EMBEDDINGS_ONNX_QUERY_PREFIX: "query: "
#   HINDSIGHT_API_EMBEDDINGS_ONNX_PASSAGE_PREFIX: "passage: "
#
#  Reranker (optional; off by default) — OpenRouter serves rerankers too (POST /api/v1/rerank),
#  so the same key reranks recall candidates. cohere/rerank-v3.5 is multilingual (100+ langs,
#  Turkish). Other multilingual options: provider "siliconflow" (BAAI/bge-reranker-v2-m3, cheap)
#  or "cohere"/"alibaba"/"google" with their own keys.
# hindsight_reranker:
#   provider: "openrouter"
#   api_key: "REPLACE_ME"                    # same OpenRouter key
#   model: "cohere/rerank-v3.5"
#   max_candidates: 120
#
#  Search backends (optional) — pgroonga handles mixed-script lexical search well:
# hindsight_text_search_extension: "pgroonga"
# hindsight_vector_extension: "pgvector"
#  Base port for the per-profile local daemon (loopback). Each profile gets base+index
#  (9077, 9078, …) so multiple profiles don't collide. Single profile stays on 9077.
# hindsight_base_port: 9077
#  Expose the per-profile Hindsight daemon to your TAILNET (never public) via Tailscale
#  Serve: https://<node>.<tailnet>.ts.net:(serve_port+index) -> 127.0.0.1:(base+index).
#  Reachable over your tailnet by hostname with a valid TLS cert; tailnet-gated by
#  Tailscale itself (no public exposure, no UFW rule). Auth is tailnet-only (the daemon
#  has none — rely on your Tailscale ACLs). Default off (loopback only).
# hindsight_expose_tailscale: false
# hindsight_serve_https_port: 9443   # Tailscale Serve HTTPS port; profile gets port+index
#  Optional control-plane WEB UI per profile (npx @vectorize-io/hindsight-control-plane) —
#  a visual memory browser fronting the daemon. Tailnet-only on http://<node>.<tailnet>.
#  ts.net:(cp_port+index) (public blocked by UFW); served directly, not via Tailscale
#  Serve (the app mishandles a TLS-terminating proxy). Needs node in runtimes. Off by default.
# hindsight_control_plane: false
# hindsight_control_plane_base_port: 19077   # UI port = base + profile index
#  Escape hatch: true = isolated per-project banks instead of one tagged profile bank.
#  Default false (profile-wide + tags) — per-project fragments personal-assistant memory.
# hindsight_per_project: false

# ── Roaming-resilient terminal: mosh (+ tmux) (ON by default) ─────────────────
#  Installs mosh and opens its UDP range on the tailscale0 interface only. mosh
#  survives network drops / IP changes (mobile, switching networks) and tmux keeps `claude`
#  alive on the box across reconnects — the resilient alternative to Claude
#  Desktop's integrated SSH remote (which drops the session on disconnect). Connect
#  with: mosh <user>@<tailscale-name> -- tmux new -A -s main  (then run `claude`).
#  NOTE: mosh's predictive echo can drop/garble keystrokes on some macOS clients (a
#  known, unfixed mosh issue) — if you hit that, set mosh_enabled: false and use
#  Eternal Terminal (et_enabled) below instead. The `devbox` CLI auto-prefers et.
mosh_enabled: true

# ── Eternal Terminal (et) — TCP auto-reconnecting shell (OPT-IN) ──────────────
#  Same roaming + tmux persistence as mosh, but TCP and WITHOUT predictive echo, so
#  keystrokes stay clean (no drops) — the fix when mosh misbehaves on macOS. Installs
#  etserver from its PPA and opens TCP 2022 on the tailscale0 interface only. The
#  `devbox` CLI uses `et` automatically when it's installed locally (brew install et).
# et_enabled: true

#  UTF-8 locale(s) to generate on the box (mosh-server adopts the client's locale).
#  The `devbox` connect command pins LC_ALL to the FIRST entry client-side, so a
#  client forwarding a locale Linux can't make (e.g. macOS en_TR.UTF-8) still works.
#  Keep en_US.UTF-8 first (a Turkish working locale's dotless-i breaks build tools).
locales:
  - en_US.UTF-8

# ── Optional cleanup (all OFF by default) ─────────────────────────────────────
# Remove superseded mise tool versions after a runtime bump (frees disk):
mise_prune: false
# Declarative removal of profiles/servers you DELETED from this file. It NEVER runs
# on a normal `ansible-playbook playbook.yml` — only via `--tags prune`, which by
# itself just removes orphaned services (and only ones claude-devbox created). It
# lists what it will remove and asks for an interactive 'yes' first. The flags below
# gate the destructive parts:
prune_removed_users: false # also delete Linux user accounts no longer listed above
remove_profile_home: false # when deleting a user, also wipe its /home (DESTROYS DATA)
# prune_assume_yes / prune_force_empty are runtime-only escape hatches (-e ...):
#   -e prune_assume_yes=true   skip the interactive prompt (for non-interactive runs)
#   -e prune_force_empty=true  allow removing ALL services when none are declared
