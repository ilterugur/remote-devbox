---
- name: Deploy Remote Control engine scripts (agent-neutral)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/{{ item }}.sh"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - agent-rc-wrapper        # tmux session bootstrap
    - agent-rc-run            # in-session launcher (sources the per-agent adapter)
    - agent-rc-monitor        # self-heal: blocking liveness monitor (Type=simple)
    - agent-rc-resume         # boot/recovery orchestrator
    - agent-rc-resume-exec    # per-session resume launcher (file-based prompts)
    - codex-host-reconcile    # fail-closed managed host adoption without session kills

- name: Deploy the resume scanner (python, deterministic — no LLM/network)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/agent-rc-resume-scan.py"
    dest: /usr/local/bin/agent-rc-resume-scan
    owner: root
    group: root
    mode: "0755"

- name: Deploy the bridge-identity snapshotter (python, driven by the monitor loop)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/agent-rc-bridge-snapshot.py"
    dest: /usr/local/bin/agent-rc-bridge-snapshot
    owner: root
    group: root
    mode: "0755"

- name: Deploy the worktree-orphan reaper (python, driven by its own timer)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/agent-rc-reap.py"
    dest: /usr/local/bin/agent-rc-reap
    owner: root
    group: root
    mode: "0755"

- name: Ensure shared data + adapters dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/share/agent-devbox
    - /usr/local/share/agent-devbox/adapters

- name: Deploy the seamless-resume system prompt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/agent-rc-resume-sys.txt"
    dest: /usr/local/share/agent-devbox/agent-rc-resume-sys.txt
    owner: root
    group: root
    mode: "0644"

- name: Deploy per-agent adapters
  ansible.builtin.copy:
    src: "adapters/"
    dest: /usr/local/share/agent-devbox/adapters/
    owner: root
    group: root
    mode: "0755"

# The unit templates place each service in its developer's slice, which they address
# by uid — the box's own fact, not something devbox.yml could state.
- name: Look up developer uids
  ansible.builtin.getent:
    database: passwd

- name: Generate a systemd unit per Remote Control server
  ansible.builtin.template:
    src: agent-rc.service.j2
    dest: "/etc/systemd/system/agent-rc-{{ row.agent }}-{{ row.user }}-{{ row.project }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ devbox_rc_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.agent }}-{{ row.user }}-{{ row.project }}"
  notify: Reload systemd

- name: Remove the ineffective transient-unit drop-in
  ansible.builtin.file:
    path: "/home/{{ row.user }}/.config/systemd/user/codex-code-mode-host.service.d"
    state: absent
  loop: "{{ devbox_codex_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"

- name: Write the managed Codex Desktop code-mode host service
  ansible.builtin.template:
    src: codex-code-mode-host.service.j2
    dest: "/home/{{ row.user }}/.config/systemd/user/codex-code-mode-host.service"
    owner: "{{ row.user }}"
    group: "{{ row.user }}"
    mode: "0600"
  loop: "{{ devbox_codex_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  register: codex_service
  tags: [heavy_gate]

- name: Reload each Codex developer's user manager
  ansible.builtin.command:
    cmd: "systemctl --user --machine={{ row.user }}@ daemon-reload"
  loop: "{{ devbox_codex_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  changed_when: false
  tags: [heavy_gate]

- name: Reconcile the managed Codex host without interrupting live sessions
  ansible.builtin.command:
    argv:
      - /usr/local/bin/codex-host-reconcile
      - "{{ item.row.user }}"
      - "{{ item.row.codex_home }}/app-server-control/app-server-control.sock"
      - "{{ item.changed | bool | ternary('true', 'false') }}"
      - "{{ item.row.resources.memory_high | default('infinity', true) }}"
      - "{{ item.row.resources.memory_max | default('infinity', true) }}"
      - "{{ item.row.resources.memory_swap_max | default('infinity', true) }}"
  loop: "{{ codex_service.results | default([]) }}"
  loop_control:
    label: "{{ item.row.user }}"
  changed_when: false
  tags: [heavy_gate]

# The always-on Codex Remote Control daemon, for developers that declared one. Written
# before the drop-in below is removed, so the unit is never briefly undefined.
- name: Write the managed Codex Remote Control service
  ansible.builtin.template:
    src: codex-remote-control.service.j2
    dest: "/home/{{ row.user }}/.config/systemd/user/codex-remote-control.service"
    owner: "{{ row.user }}"
    group: "{{ row.user }}"
    mode: "0600"
  loop: "{{ devbox_codex_remote_control_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  register: codex_rc_service
  tags: [heavy_gate]

# Adoption. Before this unit was managed it was started by hand, as a base unit plus an
# override.conf that replaced ExecStart. Leaving that drop-in in place would let the
# hand-written ExecStart win over the managed one — and it carries no PATH, which is
# the whole reason for managing the unit. Remove it once the managed unit exists.
- name: Remove the superseded hand-written Codex Remote Control drop-in
  ansible.builtin.file:
    path: "/home/{{ row.user }}/.config/systemd/user/codex-remote-control.service.d"
    state: absent
  loop: "{{ devbox_codex_remote_control_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  register: codex_rc_dropin
  tags: [heavy_gate]

- name: Reload the user manager of each Codex Remote Control developer
  ansible.builtin.command:
    cmd: "systemctl --user --machine={{ row.user }}@ daemon-reload"
  loop: "{{ devbox_codex_remote_control_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  changed_when: false
  tags: [heavy_gate]

# A daemon already running under the hand-written definition keeps the old environment
# until it is restarted, so the gate would stay absent from exactly the process this
# change exists to fix. Restart only when the definition actually moved: Remote Control
# sessions reconnect, and a needless restart drops live ones for nothing.
- name: Restart Codex Remote Control where its definition changed
  ansible.builtin.command:
    cmd: "systemctl --user --machine={{ item.0.row.user }}@ restart codex-remote-control.service"
  loop: "{{ codex_rc_service.results | default([]) | zip(codex_rc_dropin.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.row.user }}"
  when: item.0.changed or item.1.changed
  changed_when: true
  tags: [heavy_gate]

# ── Paseo daemon ──────────────────────────────────────────────────────────────
# Writing the unit does not touch the supervisor that is actually holding the fleet, so
# it is safe on its own; taking over from that supervisor is what drops live sessions,
# and that sits behind devbox_paseo_activate.
#
# One caveat found on this box 2026-08-31: a hand-written paseo-daemon.service was
# already present AND enabled, crash-looping 1686 times against the hand-started
# supervisor that owns the socket. Replacing its definition is still safe — the loop
# keeps failing for the same reason — but the next auto-restart attempt will use the
# managed definition rather than the old one, and this template's StartLimitBurst
# finally stops the loop.
- name: Write the managed Paseo daemon service
  ansible.builtin.template:
    src: paseo-daemon.service.j2
    dest: "/home/{{ row.user }}/.config/systemd/user/paseo-daemon.service"
    owner: "{{ row.user }}"
    group: "{{ row.user }}"
    mode: "0600"
  loop: "{{ devbox_paseo_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  register: paseo_service
  tags: [heavy_gate, paseo]

# Adoption. Found here 2026-08-31: a `paseo-daemon.service.d/heavy-gate.conf` stamped
# "Managed by Ansible" that nothing in this repo writes — an orphan from an earlier
# implementation that no longer exists. A drop-in is merged after the unit file, so its
# hardcoded PATH and DEVBOX_HEAVY_JOB_MEMORY_MAX would win over the managed unit's and
# silently diverge from devbox.yml. The managed unit carries both itself.
- name: Remove the superseded hand-written Paseo drop-in
  ansible.builtin.file:
    path: "/home/{{ row.user }}/.config/systemd/user/paseo-daemon.service.d"
    state: absent
  loop: "{{ devbox_paseo_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  register: paseo_dropin
  tags: [heavy_gate, paseo]

- name: Reload the user manager of each Paseo developer
  ansible.builtin.command:
    cmd: "systemctl --user --machine={{ row.user }}@ daemon-reload"
  loop: "{{ devbox_paseo_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  changed_when: false
  tags: [heavy_gate, paseo]

# Report the pending takeover rather than performing it. A supervisor outside the unit's
# own cgroup is the whole defect being fixed, so an operator reading a run needs to see
# that it is still there — silence would read as "already managed".
#
# What "outside" means has to be decided by cgroup, not by process name. Measured
# 2026-09-01: this box had paseo-daemon.service at ActiveState=active with MainPID=1264954,
# and that same PID — plus the supervisor and daemon under it — already inside
# /user.slice/user-1004.slice/user@1004.service/app.slice/paseo-daemon.service. Nothing
# needed taking over. An earlier version of this task matched on `pgrep -f 'paseo daemon
# start'` alone, so it found the unit's OWN main process and told the operator to run the
# activation anyway. That activation stops the supervisor and drops every live agent
# session — 17 of them at the time — to fix a defect that was not there.
#
# The prefix match rather than equality is deliberate: a supervisor re-execing into a
# child cgroup of the unit is still the unit's, and must not read as unmanaged.
- name: Detect a Paseo supervisor running outside the managed unit
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      user={{ row.user | quote }}
      show() {
        systemctl --user --machine="$user@" show paseo-daemon.service -p "$1" --value 2>/dev/null | tr -d '\n'
      }
      state=$(show ActiveState)
      unit_cg=$(show ControlGroup)
      main_pid=$(show MainPID)
      managed=""
      unmanaged=""
      for pid in $(pgrep -u "$user" -f 'paseo daemon start' 2>/dev/null); do
        proc_cg=$(sed -n 's/^0:://p' "/proc/$pid/cgroup" 2>/dev/null | tr -d '\n')
        owned=no
        if [ -n "$unit_cg" ]; then
          case "$proc_cg" in
            "$unit_cg" | "$unit_cg"/*) owned=yes ;;
          esac
        fi
        if [ "$pid" = "$main_pid" ]; then
          owned=yes
        fi
        if [ "$owned" = yes ]; then
          managed="${managed:+$managed,}$pid"
        else
          unmanaged="${unmanaged:+$unmanaged,}$pid"
        fi
      done
      printf '{"state":"%s","control_group":"%s","main_pid":"%s","managed":"%s","unmanaged":"%s"}\n' \
        "$state" "$unit_cg" "$main_pid" "$managed" "$unmanaged"
  loop: "{{ devbox_paseo_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  register: paseo_state
  changed_when: false
  failed_when: false
  # Reads only — systemctl show, pgrep, /proc. Running it under --check is safe, and it
  # is what makes a dry run report the real ownership state instead of a placeholder.
  # Without this the task is skipped, stdout comes back as "" rather than undefined, and
  # every from_json below fails on the empty string.
  check_mode: false
  tags: [heavy_gate, paseo]

- name: Report the pending Paseo takeover
  ansible.builtin.debug:
    msg: >-
      {{ item.row.user }}: unit file written, NOT activated
      (state: {{ (item.stdout | default('{}', true) | from_json).state | default('unknown') }};
      supervisor outside the unit: {{ (item.stdout | default('{}', true) | from_json).unmanaged }}).
      Re-run with -e devbox_paseo_activate=true to stop the unmanaged supervisor and
      start the managed unit. That drops every live agent session for this developer.
  loop: "{{ paseo_state.results | default([]) }}"
  loop_control:
    label: "{{ item.row.user }}"
  when:
    - not devbox_paseo_activate | bool
    - (item.stdout | default('{}', true) | from_json).unmanaged | default('') | length > 0
  tags: [heavy_gate, paseo]

# Say it out loud when there is nothing to take over. The whole point of the report above
# is that an operator can tell "still unmanaged" from "already fine", and that only works
# if the second case is stated rather than implied by the absence of the first.
- name: Report that the Paseo supervisor is already inside the managed unit
  ansible.builtin.debug:
    msg: >-
      {{ item.row.user }}: paseo-daemon.service is
      {{ (item.stdout | default('{}', true) | from_json).state | default('unknown') }} and already owns its
      fleet (MainPID {{ (item.stdout | default('{}', true) | from_json).main_pid }},
      cgroup {{ (item.stdout | default('{}', true) | from_json).control_group }}).
      No takeover needed — do NOT pass devbox_paseo_activate, it would drop every live
      agent session to change nothing.
  loop: "{{ paseo_state.results | default([]) }}"
  loop_control:
    label: "{{ item.row.user }}"
  when:
    - not devbox_paseo_activate | bool
    - (item.stdout | default('{}', true) | from_json).unmanaged | default('') | length == 0
  tags: [heavy_gate, paseo]

# Activation, in the only order that cannot leave two supervisors fighting over one
# daemon socket: stop whatever is running outside the unit first, then start the unit.
#
# Kill the PIDs the detection above proved are outside, not everything whose command line
# says 'paseo daemon start'. A name match here hits the unit's own MainPID whenever the
# supervisor is already managed, and with KillMode=control-group that takes the whole
# fleet down on the way to "fixing" a unit that was already correct.
- name: Stop the unmanaged Paseo supervisor before takeover
  ansible.builtin.command:
    argv: >-
      {{ ['kill'] + ((item.stdout | default('{}', true) | from_json).unmanaged.split(',')
         | reject('equalto', '') | list) }}
  loop: "{{ paseo_state.results | default([]) }}"
  loop_control:
    label: "{{ item.row.user }}"
  register: paseo_kill
  # kill exits 1 when the PID is already gone, which is the desired end state.
  failed_when: paseo_kill.rc not in [0, 1]
  changed_when: paseo_kill.rc == 0
  when:
    - devbox_paseo_activate | bool
    - (item.stdout | default('{}', true) | from_json).unmanaged | default('') | length > 0
  tags: [heavy_gate, paseo]

- name: Enable and start the managed Paseo daemon
  ansible.builtin.command:
    cmd: "systemctl --user --machine={{ row.user }}@ enable --now paseo-daemon.service"
  loop: "{{ devbox_paseo_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  changed_when: true
  when: devbox_paseo_activate | bool
  tags: [heavy_gate, paseo]

# The point of the unit is the cgroup it puts the fleet in. Assert it rather than trust
# it: a unit that started but left the fleet in a foreign scope has fixed nothing.
- name: Verify the managed Paseo daemon owns its own cgroup
  ansible.builtin.command:
    cmd: >-
      systemctl --user --machine={{ row.user }}@ show paseo-daemon.service
      -p ActiveState -p ControlGroup -p MemoryMax
  loop: "{{ devbox_paseo_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.user }}"
  register: paseo_verify
  changed_when: false
  when: devbox_paseo_activate | bool
  tags: [heavy_gate, paseo]

- name: Fail when the managed Paseo daemon did not take ownership
  ansible.builtin.assert:
    that:
      - "'ActiveState=active' in item.stdout"
      - "'/user.slice/user-' in item.stdout"
      - "'MemoryMax=infinity' not in item.stdout"
    fail_msg: >-
      paseo-daemon.service for {{ item.row.user }} is not contained:
      {{ item.stdout | default('no output') }}
  loop: "{{ paseo_verify.results | default([]) }}"
  loop_control:
    label: "{{ item.row.user }}"
  when: devbox_paseo_activate | bool
  tags: [heavy_gate, paseo]

- name: Generate a boot/recovery resume companion unit per Remote Control server
  ansible.builtin.template:
    src: agent-rc-resume.service.j2
    dest: "/etc/systemd/system/agent-rc-resume-{{ row.agent }}-{{ row.user }}-{{ row.project }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ devbox_rc_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.agent }}-{{ row.user }}-{{ row.project }}"
  when: devbox_remote_control.resume.on_boot
  notify: Reload systemd

- name: Remove resume companion units when boot-resume is disabled
  ansible.builtin.file:
    path: "/etc/systemd/system/agent-rc-resume-{{ row.agent }}-{{ row.user }}-{{ row.project }}.service"
    state: absent
  loop: "{{ devbox_rc_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.agent }}-{{ row.user }}-{{ row.project }}"
  when: not devbox_remote_control.resume.on_boot
  notify: Reload systemd

# ── Worktree-orphan reaper ────────────────────────────────────────────────────
# One box-wide timer, not one per unit: the sweep already walks every agent-rc
# cgroup in a single pass, so a unit apiece would be N wakeups doing one job.
- name: Write the worktree-orphan reaper unit and timer
  ansible.builtin.template:
    src: "agent-rc-reap.{{ item }}.j2"
    dest: "/etc/systemd/system/agent-rc-reap.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  when: devbox_remote_control.reap.enabled
  notify: Reload systemd

- name: Enable the worktree-orphan reaper timer
  ansible.builtin.systemd_service:
    name: agent-rc-reap.timer
    state: started
    enabled: true
    daemon_reload: true
  when: devbox_remote_control.reap.enabled

# Stop before removing: a timer whose unit files vanish underneath it stays loaded
# and armed in the running manager until something reloads it.
- name: Stop the worktree-orphan reaper timer when reaping is disabled
  ansible.builtin.systemd_service:
    name: agent-rc-reap.timer
    state: stopped
    enabled: false
  failed_when: false
  when: not devbox_remote_control.reap.enabled

- name: Remove the worktree-orphan reaper unit and timer when reaping is disabled
  ansible.builtin.file:
    path: "/etc/systemd/system/agent-rc-reap.{{ item }}"
    state: absent
  loop: [service, timer]
  when: not devbox_remote_control.reap.enabled
  notify: Reload systemd

# ── Legacy migration: retire the old single-agent claude-rc-* units/scripts/dir.
#    MUST run before "Enable and start" so the old RC session is gone before the new
#    agent-rc unit brings one up — two RC sessions must not fight over one login.
- name: Find legacy claude-rc units to migrate
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "claude-rc-*.service"
  register: legacy_units

- name: Stop+disable legacy claude-rc units
  ansible.builtin.systemd_service:
    name: "{{ item.path | basename }}"
    state: stopped
    enabled: false
  loop: "{{ legacy_units.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  failed_when: false

# Legacy paths are HISTORICAL literals (pre-B1 claude-rc-* engine, pre-A claude-devbox
# command/share names) — they must NOT be renamed to remote-* or the cleanup misses the
# real old files on an already-provisioned box.
- name: Remove legacy claude-rc units + old claude-devbox scripts/dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (legacy_units.files | map(attribute='path') | list)
       + ['/usr/local/bin/claude-rc-wrapper', '/usr/local/bin/claude-rc-run',
          '/usr/local/bin/claude-rc-monitor', '/usr/local/bin/claude-rc-resume',
          '/usr/local/bin/claude-rc-resume-exec', '/usr/local/bin/claude-rc-resume-scan',
          '/usr/local/share/claude-devbox/claude-rc-resume-sys.txt',
          '/usr/local/bin/claude-devbox-login', '/usr/local/bin/claude-devbox-dev',
          '/usr/local/bin/claude-config-apply', '/usr/local/share/claude-devbox',
          '/opt/claude-shared'] }}
  loop_control:
    label: "{{ item }}"
  notify: Reload systemd

- name: Load new units + drop removed ones before enabling
  ansible.builtin.meta: flush_handlers

# A `systemctl set-property` drop-in outranks the unit file, so an ad-hoc limit set
# by hand during an incident would silently survive every later run. The unit file is
# the only source of truth for these knobs.
- name: Drop ad-hoc set-property overrides on Remote Control units
  ansible.builtin.file:
    path: "/etc/systemd/system.control/agent-rc-{{ row.agent }}-{{ row.user }}-{{ row.project }}.service.d"
    state: absent
  loop: "{{ devbox_rc_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.agent }}-{{ row.user }}-{{ row.project }}"
  notify: Reload systemd

- name: Enable and start each Remote Control service
  ansible.builtin.systemd_service:
    name: "agent-rc-{{ row.agent }}-{{ row.user }}-{{ row.project }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ devbox_rc_units }}"
  loop_control:
    loop_var: row
    label: "{{ row.agent }}-{{ row.user }}-{{ row.project }}"
  # Services self-heal: each polls until its developer is logged in
  # (run `sudo remote-devbox-login`), then comes online automatically.

# ── Persist per-developer workflow-usage consent so auto-resumed workflows continue
#    without a confirmation prompt (only suppresses the token-usage warning; does
#    NOT bypass edit/bash permissions). Claude-specific, so it follows the units that
#    actually run claude, and does nothing before first login (no ~/.claude.json).
- name: Check for each developer's ~/.claude.json
  ansible.builtin.stat:
    path: "/home/{{ item }}/.claude.json"
  loop: "{{ devbox_rc_units | selectattr('agent', 'equalto', 'claude') | map(attribute='user') | unique | list }}"
  loop_control:
    label: "{{ item }}"
  register: claude_json_stat
  when: devbox_remote_control.resume.skip_workflow_warning

- name: Set skipWorkflowUsageWarning in each developer's ~/.claude.json
  ansible.builtin.command:
    cmd: >-
      python3 -c "import json,sys;p=sys.argv[1];d=json.load(open(p));
      changed=d.get('skipWorkflowUsageWarning')!=True;d['skipWorkflowUsageWarning']=True;
      open(p,'w').write(json.dumps(d,indent=2)) if changed else None;
      print('CHANGED' if changed else 'OK')"
      "/home/{{ item.item }}/.claude.json"
  become: true
  become_user: "{{ item.item }}"
  loop: "{{ claude_json_stat.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - devbox_remote_control.resume.skip_workflow_warning
    - item.stat is defined and item.stat.exists | default(false)
  register: skip_warning_set
  # In a loop, changed_when is evaluated per item against that item's own result,
  # so reference the bare `stdout` (skip_warning_set.stdout is the aggregate and is
  # undefined mid-loop, which would suppress the changed status).
  changed_when: "'CHANGED' in (stdout | default(''))"

- name: Deploy the Remote Control operator helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/{{ item.src }}"
    dest: "/usr/local/bin/{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    # agent_profiles owns remote-devbox-login: it knows every provider/profile and
