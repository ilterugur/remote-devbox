- name: Append one matrix row per agent for this (profile, project)
  ansible.builtin.set_fact:
    rc_matrix: "{{ rc_matrix | default([]) + [_row] }}"
  loop: "{{ item.0.agents | default(['claude']) }}"
  loop_control:
    loop_var: _agent
    label: "{{ item.0.user }}-{{ item.1.project }}-{{ _agent }}"
  vars:
    _row:
      user: "{{ item.0.user }}"
      project: "{{ item.1.project }}"
      agent: "{{ _agent }}"
      server: "{{ item.1 }}"
      profile: "{{ item.0 }}"
