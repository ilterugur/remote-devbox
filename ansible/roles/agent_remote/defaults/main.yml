---
# Generated by the devbox client from devbox.yml. Defaulted here so a run against a
# generated.yml written before the Paseo unit existed is a no-op rather than an error.
devbox_paseo_units: []

# Taking over a hand-started Paseo supervisor means stopping it, and that drops every
# live agent session with it. Writing the unit file is safe and idempotent; activating
# it is not, so activation is a separate, explicit decision:
#
#   ansible-playbook playbook.yml -e devbox_paseo_activate=true
#
# With this false the run leaves the unit file on disk, inert: not enabled, not started,
# and the running supervisor untouched.
devbox_paseo_activate: false
