---
# On by default (mosh_enabled: true; set false to skip). mosh + tmux gives a
# roaming-resilient terminal: mosh survives network drops and IP changes (mobile,
# phone switching cells/Wi-Fi), while tmux keeps the session — and the `claude`
# running in it — alive on the box across reconnects. This is the resilient
# alternative to Claude Desktop's integrated SSH remote, which drops the session
# on disconnect with no resume (anthropics/claude-code#49790). tmux is already
# installed (the Remote Control service uses it).

- name: Install mosh + the locales package
  # mosh-server adopts the locale the client forwards (e.g. macOS sends en_US.UTF-8);
  # if that locale isn't generated on the box, mosh-server fails to start with
  # "Did not find mosh server startup message". The `locales` package lets us generate it.
  ansible.builtin.apt:
    name:
      - mosh
      - locales
    state: present
    update_cache: true

- name: Generate the configured UTF-8 locale(s)
  # mosh-server adopts the locale forwarded by the client (via mosh-server -l ...), so
  # that locale must exist here. The `devbox` connect command pins LC_ALL to the first
  # of these client-side, which is the real fix for clients (e.g. macOS) that forward a
  # region locale like en_TR.UTF-8 that Linux can't provide. Add more here if you want a
  # different working locale available (note: a Turkish locale's dotless-i case-folding
  # can break build tools — keep en_US.UTF-8 as the default).
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ devbox_host.locales }}"

- name: Warn when mosh opens its UDP range publicly (no tailnet to scope to)
  ansible.builtin.debug:
    msg: >-
      mosh is enabled but tailscale is disabled — the UDP 60000-61000 range will be
      opened on ALL interfaces (public internet), not scoped to tailscale0. This is an
      explicit opt-in (you set mosh_enabled: true without Tailscale). Restrict it with your
      own firewall/VPN, or set mosh_enabled: false.
  when: not (devbox_network.tailscale.enabled)

- name: Remove stale public mosh UFW rule (ufw is additive; re-scoping to tailnet)
  # community.general.ufw only adds rules — toggling tailscale_enabled false→true
  # doesn't remove the old public (no-interface) allow rule, so the UDP range would
  # stay reachable from the public internet even after "re-scoping" to tailscale0.
  # Mirrors the legacy-cleanup idiom in roles/hindsight/tasks/main.yml.
  community.general.ufw:
    rule: allow
    direction: in
    proto: udp
    port: "60000:61000"
    delete: true
  when: devbox_network.tailscale.enabled
  failed_when: false

- name: Remove stale tailscale-scoped mosh UFW rule (tailscale now disabled)
  # Mirror case: toggling tailscale_enabled true→false leaves the old
  # tailscale0-scoped allow rule in place alongside the new public one.
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0
    proto: udp
    port: "60000:61000"
    delete: true
  when: not (devbox_network.tailscale.enabled)
  failed_when: false

- name: Allow mosh (UDP 60000-61000)
  # With Tailscale: scoped to the tailscale0 interface so the range is reachable only from
  # your tailnet (connect to the box's Tailscale address). Without Tailscale: no interface
  # scope, so the range is public (see the warning above) — reach mosh over the box's host.
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ 'tailscale0' if (devbox_network.tailscale.enabled) else omit }}"
    proto: udp
    port: "60000:61000"
    comment: "{{ 'mosh over tailscale' if (devbox_network.tailscale.enabled) else 'mosh (public — no tailnet)' }}"
