---
# Eternal Terminal (et) — a TCP, auto-reconnecting remote shell. Same win as mosh
# (survives network drops / IP roaming / laptop sleep, with tmux keeping the session
# and the `claude` in it alive), but WITHOUT mosh's predictive-echo layer — which on
# macOS clients is a known, unfixed source of dropped/garbled keystrokes
# (zellij-org/zellij#3717, mobile-shell/mosh#234). ET is TCP, so it stays clean even
# over a relayed Tailscale path, and integrates with tmux. On by default once enabled
# via et_enabled; pairs with the existing tmux install (the Remote Control service).
#
# ET isn't in Ubuntu's repos; it ships via the jgmath2000/et PPA. We add that PPA by
# hand (deb822 + a keyring) rather than via `ppa:` so we can pin the suite: the PPA has
# no build for very new Ubuntu (e.g. 26.04 resolute), so fall back to the newest suite
# it does build for. `et_ppa_suite` overrides this if a matching build appears later.

- name: Ensure the apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Fetch the Eternal Terminal PPA signing key
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xD3614CB0B3C2D154356BD436CB4ADEA5B72A07A1"
    dest: /etc/apt/keyrings/eternalterminal.asc
    mode: "0644"
    # The keyserver sends no validators, so get_url re-downloads and reports a change on
    # every run. A signing key does not rotate under a fixed fingerprint — fetch it once.
    force: false

- name: Add the Eternal Terminal apt source (suite pinned — PPA lacks a build for the newest Ubuntu)
  ansible.builtin.deb822_repository:
    name: eternalterminal
    types: deb
    uris: "https://ppa.launchpadcontent.net/jgmath2000/et/ubuntu"
    suites: "{{ et_ppa_suite | default('questing') }}"
    components: main
    signed_by: /etc/apt/keyrings/eternalterminal.asc
    state: present

- name: Install Eternal Terminal (etserver + et client)
  ansible.builtin.apt:
    name: et
    state: present
    update_cache: true

- name: Enable and start the etserver service
  ansible.builtin.systemd_service:
    name: et
    enabled: true
    state: started

- name: Warn when et opens its port publicly (no tailnet to scope to)
  ansible.builtin.debug:
    msg: >-
      et is enabled but tailscale_enabled is false — TCP 2022 will be opened on ALL
      interfaces (public internet), not scoped to tailscale0. etserver only accepts
      sessions bootstrapped over ssh, but this is still extra public surface.
  when: not (devbox_network.tailscale.enabled)

- name: Remove stale public et UFW rule (ufw is additive; re-scoping to tailnet)
  # community.general.ufw only adds rules — toggling tailscale_enabled false→true
  # doesn't remove the old public (no-interface) allow rule. Mirrors the mosh role.
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    port: "2022"
    delete: true
  when: devbox_network.tailscale.enabled
  failed_when: false

- name: Remove stale tailscale-scoped et UFW rule (tailscale now disabled)
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0
    proto: tcp
    port: "2022"
    delete: true
  when: not (devbox_network.tailscale.enabled)
  failed_when: false

- name: Allow Eternal Terminal (TCP 2022)
  # With Tailscale: scoped to the tailscale0 interface so etserver is reachable only
  # from your tailnet — connect to the box's Tailscale address. Without Tailscale: no
  # interface scope (public). ET bootstraps over ssh (already open) then carries the
  # session on this TCP port.
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ 'tailscale0' if (devbox_network.tailscale.enabled) else omit }}"
    proto: tcp
    port: "2022"
    comment: "{{ 'eternal terminal over tailscale' if (devbox_network.tailscale.enabled) else 'eternal terminal (public — no tailnet)' }}"
