---
# An agent profile is one login of one agent. A developer can hold several — two Claude
# accounts and a Codex account, say — because each profile gets its own config tree and
# the wrapper points the provider's config env var at it.
#
# A profile carries NO git identity: which account a commit is attributed to is a
# property of the project, not of the agent driving it (see the projects role).

- name: Flatten the declared agent profiles
  ansible.builtin.set_fact:
    _devbox_agent_profiles: "{{ _raw__devbox_agent_profiles | from_json }}"
  tags: [heavy_gate]
  vars:
    _raw__devbox_agent_profiles: >-
      {%- set out = [] -%}
      {%- for dev in devbox_developers -%}
        {%- for name, profile in (dev.agent_profiles | default({})).items() -%}
          {{- out.append({
                'user': dev.user,
                'name': name,
                'provider': profile.provider,
                'omp_model_presets': profile.omp_model_presets | default(none),
                'heavy_job_gate_enabled': (dev.heavy_job_gate | default({'enabled': true})).enabled,
                'heavy_job_gate_categories': ((dev.heavy_job_gate | default({})).categories | default({'build': true, 'typecheck': true, 'generate': true, 'test': true}) | dict2items | selectattr('value', 'equalto', true) | map(attribute='key') | list),
                'heavy_job_gate_wait_timeout_sec': (dev.heavy_job_gate | default({})).wait_timeout_sec | default(1800),
                'heavy_job_gate_warn_after_sec': (dev.heavy_job_gate | default({})).warn_after_sec | default(5),
                'heavy_job_gate_memory_max': (dev.heavy_job_gate | default({})).memory_max | default('8G'),
                'is_default': name == dev.default_agent_profile}) or '' -}}
        {%- endfor -%}
      {%- endfor -%}
      {{ out | to_json }}

- name: Install the shared heavy-command gate
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/devbox-heavy-command.sh"
    dest: /usr/local/bin/devbox-heavy-command
    owner: root
    group: root
    mode: "0755"
  tags: [heavy_gate]

- name: Create the heavy-command PATH shim directory
  ansible.builtin.file:
    path: /usr/local/lib/agent-devbox/heavy-command-gate
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [heavy_gate]

- name: Inspect heavy-command shim paths before linking
  ansible.builtin.stat:
    path: "/usr/local/lib/agent-devbox/heavy-command-gate/{{ item }}"
    follow: false
  loop:
    - bun
    - bunx
    - node
    - npm
    - npx
    - pnpm
    - prisma
    - tsc
    - turbo
    - next
    - yarn
  register: heavy_command_shims
  tags: [heavy_gate]

- name: Refuse to replace a foreign heavy-command shim
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or
        (item.stat.islnk and
         item.stat.lnk_source == '/usr/local/bin/devbox-heavy-command')
    fail_msg: >-
      Refusing to replace foreign path
      /usr/local/lib/agent-devbox/heavy-command-gate/{{ item.item }}.
  loop: "{{ heavy_command_shims.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [heavy_gate]

- name: Route memory-heavy toolchain commands through the shared gate
  ansible.builtin.file:
    src: /usr/local/bin/devbox-heavy-command
    dest: "/usr/local/lib/agent-devbox/heavy-command-gate/{{ item }}"
    state: link
    owner: root
    group: root
    # The preceding copy is intentionally not materialized by --check. Allow a
    # dangling link only in that dry-run; the stat/assert above still blocks collisions.
    force: "{{ ansible_check_mode }}"
  loop:
    - bun
    - bunx
    - node
    - npm
    - npx
    - pnpm
    - prisma
    - tsc
    - turbo
    - next
    - yarn
  tags: [heavy_gate]

# The shims above only bite while their directory sits ahead of mise's on PATH. Codex
# runs every command as `bash -lc`, and mise's activation snippet prepends its
# installs/*/bin ahead of everything the daemon unit passed down — so bun, node and npm
# resolved to the real toolchain and no build a Codex session ran was ever gated. This
# sorts after mise.sh in /etc/profile.d and puts the gate back in front. It only
# reorders: a developer with the gate off never has the directory on PATH to reorder.
- name: Keep the heavy-command gate ahead of mise in login shells
  ansible.builtin.template:
    src: heavy-gate-path.sh.j2
    dest: /etc/profile.d/zz-agent-devbox-heavy-gate.sh
    owner: root
    group: root
    mode: "0644"
  tags: [heavy_gate]

- name: Reject a profile whose provider has no adapter
  ansible.builtin.assert:
    that: item.provider in devbox_agent_adapters
    fail_msg: >-
      agent profile '{{ item.user }}/{{ item.name }}' asks for provider
      '{{ item.provider }}', which has no adapter. Known: {{ devbox_agent_adapters.keys() | join(', ') }}.
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"

# Each provider binary is installed once per developer, however many profiles use it —
# the binary is shared, only the config trees are separate.
- name: Work out which providers each developer needs
  ansible.builtin.set_fact:
    _devbox_agent_installs: "{{ _raw__devbox_agent_installs | from_json }}"
  vars:
    _raw__devbox_agent_installs: >-
      {%- set out = [] -%}
      {%- for dev in devbox_developers -%}
        {%- for provider in (dev.agent_profiles | default({})).values()
                            | map(attribute='provider') | unique -%}
          {{- out.append({
                'user': dev.user,
                'provider': provider,
                'version': (dev.agent_versions | default({})).get(provider, none)}) or '' -}}
        {%- endfor -%}
      {%- endfor -%}
      {{ out | to_json }}

- name: Install each unversioned agent binary
  ansible.builtin.shell:
    cmd: "set -o pipefail; timeout 600 bash -lc '{{ devbox_agent_adapters[item.provider].install_cmd }}'"
    executable: /bin/bash
    creates: "/home/{{ item.user }}/{{ devbox_agent_adapters[item.provider].install_creates }}"
  become: true
  become_user: "{{ item.user }}"
  environment:
    HOME: "/home/{{ item.user }}"
  loop: "{{ _devbox_agent_installs }}"
  loop_control:
    label: "{{ item.user }}/{{ item.provider }}"
  when: item.version is none

- name: Inspect pinned agent versions
  ansible.builtin.shell:
    cmd: >-
      bash -lc "/home/{{ item.user }}/{{ devbox_agent_adapters[item.provider].bin_path }}
      {{ devbox_agent_adapters[item.provider].version_args }}"
    executable: /bin/bash
  become: true
  become_user: "{{ item.user }}"
  environment:
    HOME: "/home/{{ item.user }}"
  loop: "{{ _devbox_agent_installs }}"
  loop_control:
    label: "{{ item.user }}/{{ item.provider }}@{{ item.version }}"
  when: item.version is not none
  register: _devbox_pinned_agent_versions
  changed_when: false
  failed_when: false

- name: Install pinned agent binaries when their versions differ
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail; timeout 600 bash -lc
      '{{ devbox_agent_adapters[item.item.provider].install_cmd
          | replace("__VERSION__", item.item.version) }}'
    executable: /bin/bash
  become: true
  become_user: "{{ item.item.user }}"
  environment:
    HOME: "/home/{{ item.item.user }}"
  loop: "{{ _devbox_pinned_agent_versions.results }}"
  loop_control:
    label: "{{ item.item.user }}/{{ item.item.provider }}@{{ item.item.version }}"
  when:
    - not (item.skipped | default(false))
    - item.rc != 0 or item.item.version not in (item.stdout | default(''))

- name: Verify each agent binary runs (catches a truncated install)
  # Through a login shell: an agent installed via npm carries an `env node` shebang, so
  # it only resolves once mise has put the toolchain on PATH — exactly the environment
  # the profile wrapper sets up before it execs.
  ansible.builtin.shell:
    cmd: >-
      bash -lc "/home/{{ item.user }}/{{ devbox_agent_adapters[item.provider].bin_path }}
      {{ devbox_agent_adapters[item.provider].version_args }}"
    executable: /bin/bash
  become: true
  become_user: "{{ item.user }}"
  environment:
    HOME: "/home/{{ item.user }}"
  loop: "{{ _devbox_agent_installs }}"
  loop_control:
    label: "{{ item.user }}/{{ item.provider }}"
  changed_when: false
  register: _devbox_agent_version_checks

- name: Assert installed agent versions match their pins
  ansible.builtin.assert:
    that:
      - >-
        (item.stdout | regex_search(
          '(^|[^0-9])' ~ (item.item.version | regex_escape) ~ '([^0-9]|$)'
        )) is not none
    fail_msg: >-
      {{ item.item.user }}/{{ item.item.provider }} reported '{{ item.stdout | trim }}',
      expected exact pinned version {{ item.item.version }}.
  loop: "{{ _devbox_agent_version_checks.results }}"
  loop_control:
    label: "{{ item.item.user }}/{{ item.item.provider }}@{{ item.item.version }}"
  when: item.item.version is not none

- name: Create the per-profile config trees
  ansible.builtin.file:
    path: "/home/{{ item.user }}/.agent-profiles/{{ item.name }}"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0700"
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"

- name: Create the OMP model preset extension directories
  ansible.builtin.file:
    path: "/home/{{ item.user }}/.agent-profiles/{{ item.name }}/extensions/omp-model-presets"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0700"
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  when:
    - item.provider == 'omp'
    - item.omp_model_presets is not none

- name: Install the OMP model preset extension adapter
  ansible.builtin.copy:
    src: omp-model-presets/index.ts
    dest: "/home/{{ item.user }}/.agent-profiles/{{ item.name }}/extensions/omp-model-presets/index.ts"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0600"
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  when:
    - item.provider == 'omp'
    - item.omp_model_presets is not none

- name: Install the provider-neutral OMP model preset core
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../clients/devbox/src/omp-model-presets/core.ts"
    dest: "/home/{{ item.user }}/.agent-profiles/{{ item.name }}/extensions/omp-model-presets/core.ts"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0600"
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  when:
    - item.provider == 'omp'
    - item.omp_model_presets is not none

- name: Write declarative OMP model presets
  ansible.builtin.copy:
    content: "{{ item.omp_model_presets | to_nice_json }}\n"
    dest: "/home/{{ item.user }}/.agent-profiles/{{ item.name }}/model-presets.json"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0600"
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  when:
    - item.provider == 'omp'
    - item.omp_model_presets is not none

- name: Remove unmanaged OMP model preset extensions
  ansible.builtin.file:
    path: "/home/{{ item.user }}/.agent-profiles/{{ item.name }}/extensions/omp-model-presets"
    state: absent
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  when:
    - item.provider == 'omp'
    - item.omp_model_presets is none

- name: Remove unmanaged OMP model preset documents
  ansible.builtin.file:
    path: "/home/{{ item.user }}/.agent-profiles/{{ item.name }}/model-presets.json"
    state: absent
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  when:
    - item.provider == 'omp'
    - item.omp_model_presets is none

# One file, sourced by every entry point that starts an agent. The launcher is not the
# only one: an always-on Remote Control session never goes through it, so wiring the
# gate into the launcher alone leaves the box's busiest path ungated.
- name: Write the heavy-job gate environment each agent entry point sources
  ansible.builtin.template:
    src: heavy-gate.env.j2
    dest: "/home/{{ item.user }}/.agent-profiles/{{ item.name }}/heavy-gate.env"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0600"
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  when: item.heavy_job_gate_enabled | default(true)
  tags: [heavy_gate]

# Absence is how a profile opts out: both entry points source the file only when it is
# readable, so removing it is what actually turns the gate off for that profile.
- name: Remove the heavy-job gate environment where the gate is disabled
  ansible.builtin.file:
    path: "/home/{{ item.user }}/.agent-profiles/{{ item.name }}/heavy-gate.env"
    state: absent
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  when: not (item.heavy_job_gate_enabled | default(true))
  tags: [heavy_gate]

# The wrapper IS the profile: running `claude` directly would use the developer's
# default config tree and quietly mix two accounts' credentials.
- name: Install a launcher per agent profile
  ansible.builtin.template:
    src: agent-wrapper.sh.j2
    dest: "/home/{{ item.user }}/.local/bin/{{ item.name }}"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0700"
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  tags: [heavy_gate]

- name: Pre-accept Claude's first-run dialogs so headless launches don't block
  # An untrusted workspace or the first-run Remote Control prompt makes a non-interactive
  # `claude` hang forever. Seed the flags in this PROFILE's config, not the developer's.
  ansible.builtin.command:
    cmd: >-
      python3 -c 'import json,os,sys;
      p=os.path.join(sys.argv[1],".claude.json");
      os.makedirs(sys.argv[1],exist_ok=True);
      d=json.load(open(p)) if os.path.exists(p) else {};
      d["remoteDialogSeen"]=True;
      pr=d.setdefault("projects",{});
      pr.setdefault(sys.argv[2],{})["hasTrustDialogAccepted"]=True;
      json.dump(d,open(p,"w"),indent=2)'
      "/home/{{ item.user }}/.agent-profiles/{{ item.name }}"
      "/home/{{ item.user }}"
  become: true
  become_user: "{{ item.user }}"
  environment:
    HOME: "/home/{{ item.user }}"
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
  when: item.provider == 'claude'
  changed_when: false

- name: Install the login helper
  ansible.builtin.template:
    src: devbox-agent-login.sh.j2
    dest: /usr/local/bin/remote-devbox-login
    owner: root
    group: root
    mode: "0755"

- name: Agent profiles that still need an interactive login
  ansible.builtin.debug:
    msg: >-
      {{ item.user }}/{{ item.name }} ({{ item.provider }}) —
      {{ devbox_agent_adapters[item.provider].login_hint }}. As the operator:
      `sudo remote-devbox-login {{ item.user }} {{ item.name }}`.
  loop: "{{ _devbox_agent_profiles }}"
  loop_control:
    label: "{{ item.user }}/{{ item.name }}"
