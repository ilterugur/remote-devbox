---
# Hardening order is deliberate: the operator key is proven to work BEFORE root login is
# disabled, the drop-in is syntax-validated before it lands, and sshd is restarted only
# via a handler at the very end.
#
# security_harden_ssh (default true) gates the hardening and its probes: set it false to
# adopt an existing box without touching sshd (root/password login stay as-is) — the UFW
# and fail2ban tasks still run. Flip it to true once operator key login is proven.

- name: Pre-flight — confirm operator can log in with key before hardening
  when: devbox_host.harden_ssh
  ansible.builtin.command:
    cmd: >-
      ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new
      -o ConnectTimeout=15 -i {{ devbox_operator.private_key_path }}
      {{ devbox_operator.user }}@{{ ansible_host }} true
  delegate_to: localhost
  become: false
  register: _ssh_probe
  until: _ssh_probe.rc == 0
  retries: 5
  delay: 3
  changed_when: false

- name: Pre-flight — confirm operator has working passwordless sudo
  when: devbox_host.harden_ssh
  ansible.builtin.command:
    cmd: >-
      ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new
      -o ConnectTimeout=15 -i {{ devbox_operator.private_key_path }}
      {{ devbox_operator.user }}@{{ ansible_host }} sudo -n true
  delegate_to: localhost
  become: false
  register: _sudo_probe
  until: _sudo_probe.rc == 0
  retries: 5
  delay: 3
  changed_when: false
  # If this fails, the operator can't sudo — abort before locking out root.

- name: Deploy sshd hardening drop-in
  when: devbox_host.harden_ssh
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: Apply the sshd restart now (current connection survives it)
  ansible.builtin.meta: flush_handlers

# ── UFW — allow SSH BEFORE enabling, or you lock yourself out ─────────────────
- name: Allow SSH from anywhere
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: devbox_network.ssh.exposure in ['public_and_tailscale', 'public_only']

# Removing the any-interface rule is the one firewall change that can strand you, so it
# only happens once the tailnet interface is actually up.
- name: Refuse to restrict SSH to the tailnet before the tailnet exists
  ansible.builtin.assert:
    that: "'tailscale0' in ansible_facts.interfaces"
    fail_msg: >-
      network.ssh.exposure is tailscale_only but this host has no tailscale0 interface.
      Bring Tailscale up first, or set exposure to public_and_tailscale.
  when: devbox_network.ssh.exposure == 'tailscale_only'

- name: Restrict SSH to the tailnet interface only
  community.general.ufw:
    rule: allow
    name: OpenSSH
    delete: true
  when: devbox_network.ssh.exposure == 'tailscale_only'

- name: Allow SSH over the tailnet
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    interface: tailscale0
    direction: in
  when:
    - devbox_network.tailscale.enabled | bool
    - devbox_network.ssh.exposure in ['public_and_tailscale', 'tailscale_only']

- name: Default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable and start fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started

# ── File bridge: the lazy-mount reverse tunnel (ssh -R) needs TCP forwarding ───
- name: Read effective sshd config
  ansible.builtin.command: sshd -T
  changed_when: false
  register: _sshd_eff

- name: Assert sshd permits TCP forwarding (devbox lazy-mount reverse tunnel needs it)
  ansible.builtin.assert:
    that: "'allowtcpforwarding no' not in (_sshd_eff.stdout | lower)"
    fail_msg: >-
      sshd has AllowTcpForwarding disabled; devbox lazy mounts (ssh -R) will not work.
      Remove that directive from the hardening config.

- name: Check sshd has an SFTP subsystem (Mutagen agent install uses scp/sftp)
  ansible.builtin.shell: >-
    grep -RqsiE '^[[:space:]]*Subsystem[[:space:]]+sftp' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/
  register: _sftp_present
  changed_when: false
  failed_when: false

- name: Assert the SFTP subsystem is present
  ansible.builtin.assert:
    that: _sftp_present.rc == 0
    fail_msg: >-
      sshd has no SFTP subsystem; Mutagen cannot install its agent (devbox sync, Mutagen engine).
      Restore `Subsystem sftp /usr/lib/openssh/sftp-server` in /etc/ssh/sshd_config.
