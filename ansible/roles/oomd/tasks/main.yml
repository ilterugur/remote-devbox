---
# systemd-oomd is the pressure net for processes below each developer's user manager,
# such as editor servers and user services that have no dedicated hard ceiling. Login
# and desktop session scopes are siblings of user@.service; the developer slice's hard
# MemoryMax and MemorySwapMax still contain those without exposing UID-owned children
# to a root-owned pressure monitor that cannot honor their omit preference.
#
# Remote Control units carry ManagedOOMPreference=avoid and the aggregate Codex host
# carries omit. Each is already bounded by its own MemoryMax, where the kernel can kill
# the runaway child instead of sacrificing every session in the host.

# Ubuntu keeps /tmp entries for 10 days by default. Agent package installs can create
# hundreds of thousands of files per scratch tree, exhausting tmpfs inodes long before
# that age even when byte capacity remains. Override the vendor file by basename; the
# stock daily systemd-tmpfiles-clean.timer then removes only entries inactive for 3 days.
# Merely deploying the policy does not run an immediate clean, so provisioning never
# deletes a live operator's temporary work unexpectedly.
- name: Bound temporary-file retention for agent build workloads
  ansible.builtin.template:
    src: tmp.conf.j2
    dest: /etc/tmpfiles.d/tmp.conf
    owner: root
    group: root
    mode: "0644"
  register: tmpfiles_policy

# --create only creates and adjusts; it never removes by age (that is the daily
# systemd-tmpfiles-clean.timer). Safe to run on every apply, and needed here because an
# agent whose unit already points TMPDIR at the scratch directory cannot wait for the
# next boot to have one.
- name: Materialize the scratch directories the policy declares
  ansible.builtin.command:
    cmd: systemd-tmpfiles --create /etc/tmpfiles.d/tmp.conf
  when: tmpfiles_policy.changed
  changed_when: true

# The retention policy above cannot help with this: it measures days, while a runaway
# fills the tmpfs in minutes. What bounds the damage is the filesystem size itself.
- name: Create the /tmp mount override directory
  ansible.builtin.file:
    path: /etc/systemd/system/tmp.mount.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Bound the tmpfs behind /tmp
  ansible.builtin.template:
    src: tmp-size.conf.j2
    dest: /etc/systemd/system/tmp.mount.d/10-devbox-size.conf
    owner: root
    group: root
    mode: "0644"
  register: tmp_size_policy

- name: Reload systemd so the bound is known to the manager
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: tmp_size_policy.changed

# The drop-in only governs the NEXT mount, and /tmp has been mounted since boot. A
# tmpfs takes a new size on a live remount without unmounting, so no open file handle
# and no held flock is disturbed — waiting for a reboot would leave the box unbounded
# for weeks, which is exactly how long the current uptime is.
- name: Read what /tmp currently holds
  ansible.builtin.command:
    cmd: df -Pk /tmp
  register: tmp_usage
  changed_when: false
  when: tmp_size_policy.changed

# Shrinking a tmpfs below its current contents is the one way this can go wrong, and the
# kernel's error for it is opaque. Say what to do instead. A percentage bound cannot be
# compared without the host's RAM figure, so it is left for the remount to arbitrate.
- name: Refuse to shrink /tmp below what it already holds
  ansible.builtin.assert:
    that:
      - (tmp_usage.stdout_lines[1].split()[2] | int) <= (_tmp_size_kb | int)
    fail_msg: >-
      /tmp holds {{ tmp_usage.stdout_lines[1].split()[2] }}K but host.tmp_size is
      {{ _tmp_size }} ({{ _tmp_size_kb }}K). Clear /tmp before applying, or raise it.
  vars:
    _tmp_size: "{{ devbox_host.tmp_size | default('4G', true) }}"
    _tmp_size_kb: "{{ (_tmp_size | human_to_bytes) // 1024 }}"
  when:
    - tmp_size_policy.changed
    - not (devbox_host.tmp_size | default('4G', true)).endswith('%')

- name: Apply the bound to the live /tmp without unmounting it
  ansible.builtin.command:
    argv:
      - mount
      - -o
      - "remount,size={{ devbox_host.tmp_size | default('4G', true) }}"
      - /tmp
  changed_when: true
  when: tmp_size_policy.changed

- name: Install systemd-oomd
  ansible.builtin.apt:
    name: systemd-oomd
    state: present
    update_cache: true
  when: devbox_host.oomd.enabled

- name: Look up developer uids
  ansible.builtin.getent:
    database: passwd

- name: Migrate managed-OOM monitoring to the UID-owned boundary
  ansible.builtin.include_tasks: ownership-boundary.yml

- name: Enable and start systemd-oomd
  ansible.builtin.systemd_service:
    name: systemd-oomd
    enabled: true
    state: started
  when: devbox_host.oomd.enabled

- name: Stop and disable systemd-oomd when it is turned off
  ansible.builtin.systemd_service:
    name: systemd-oomd
    enabled: false
    state: stopped
  when: not devbox_host.oomd.enabled
  # oomd may never have been installed if it was always off, and stopping/disabling a
  # unit that does not exist is the only failure this should swallow. The reconcile
  # above already cleared the set-property override regardless of whether this task
  # succeeds, so a real systemd/D-Bus failure here leaves the slices correctly
  # configured either way; we accept mirroring resource_limits' precedent rather than
  # adding a stat-based existence check.
  failed_when: false
