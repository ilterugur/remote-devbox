---
# systemd-oomd is the net for work that runs outside a Remote Control unit — login
# shells, the editor server, the desktop session. Those have no unit ceiling of their
# own, so without this a runaway there still parks the host in swap thrash.
#
# Remote Control units carry ManagedOOMPreference=avoid: they are already bounded by
# their own MemoryMax, and that bound kills the build rather than the session. A
# neighbour's overrun must not take out a live agent session.

# Ubuntu keeps /tmp entries for 10 days by default. Agent package installs can create
# hundreds of thousands of files per scratch tree, exhausting tmpfs inodes long before
# that age even when byte capacity remains. Override the vendor file by basename; the
# stock daily systemd-tmpfiles-clean.timer then removes only entries inactive for 3 days.
# Merely deploying the policy does not run an immediate clean, so provisioning never
# deletes a live operator's temporary work unexpectedly.
- name: Bound temporary-file retention for agent build workloads
  ansible.builtin.template:
    src: tmp.conf.j2
    dest: /etc/tmpfiles.d/tmp.conf
    owner: root
    group: root
    mode: "0644"

- name: Install systemd-oomd
  ansible.builtin.apt:
    name: systemd-oomd
    state: present
    update_cache: true
  when: devbox_host.oomd.enabled

- name: Look up developer uids
  ansible.builtin.getent:
    database: passwd

# Keep live reconciliation testable and atomic in one narrowly-owned helper. It
# neutralizes the unsafe root-owned monitor before arming the UID-owned boundary.
- name: Install the managed-OOM ownership-boundary reconciler
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/oomd-user-policy-reconcile.sh"
    dest: /usr/local/bin/oomd-user-policy-reconcile
    owner: root
    group: root
    mode: "0755"

- name: Create the user-manager drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/user@{{ ansible_facts.getent_passwd[item.user][1] }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ devbox_developers }}"
  loop_control:
    label: "{{ item.user }}"
  when: devbox_host.oomd.enabled

- name: Remove the legacy root-owned slice pressure monitor
  ansible.builtin.file:
    path: "/etc/systemd/system/user-{{ ansible_facts.getent_passwd[item.user][1] }}.slice.d/50-oomd.conf"
    state: absent
  loop: "{{ devbox_developers }}"
  loop_control:
    label: "{{ item.user }}"
  notify: Reload systemd

- name: Write each developer's UID-owned managed-OOM drop-in
  ansible.builtin.template:
    src: user-manager-oomd.conf.j2
    dest: "/etc/systemd/system/user@{{ ansible_facts.getent_passwd[item.user][1] }}.service.d/50-oomd.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ devbox_developers }}"
  loop_control:
    label: "{{ item.user }}"
  when: devbox_host.oomd.enabled
  notify: Reload systemd

- name: Remove each developer's user-manager drop-in when oomd is turned off
  ansible.builtin.file:
    path: "/etc/systemd/system/user@{{ ansible_facts.getent_passwd[item.user][1] }}.service.d/50-oomd.conf"
    state: absent
  loop: "{{ devbox_developers }}"
  loop_control:
    label: "{{ item.user }}"
  when: not devbox_host.oomd.enabled
  notify: Reload systemd

# daemon-reload alone only affects units started afterwards (and, on a failed later role,
# might never run at all — handlers fire at the end of the whole play). systemd-oomd
# is already enabled and started by its own postinst once the apt task above runs, so
# flushing here does not happen before the daemon starts. What it guarantees is that the
# drop-in is loaded before any cgroup is handed to the daemon with a kill policy: the
# reconcile below is what actually migrates the live boundary, and it runs after this.
- name: Apply the systemd change now
  ansible.builtin.meta: flush_handlers

# Reconcile both boundaries on every run. This clears legacy system.control values
# that outrank the removed slice drop-in and updates a running user manager without
# logging the developer out or restarting any child service.
- name: Reconcile the managed-OOM ownership boundary
  ansible.builtin.command:
    argv:
      - /usr/local/bin/oomd-user-policy-reconcile
      - "{{ ansible_facts.getent_passwd[item.user][1] }}"
      - "{{ devbox_host.oomd.enabled | bool | ternary('true', 'false') }}"
      - "{{ devbox_host.oomd.memory_pressure_limit }}"
      - "{{ devbox_host.oomd.memory_pressure_duration_sec | string }}"
  loop: "{{ devbox_developers }}"
  loop_control:
    label: "{{ item.user }}"
  changed_when: false

- name: Enable and start systemd-oomd
  ansible.builtin.systemd_service:
    name: systemd-oomd
    enabled: true
    state: started
  when: devbox_host.oomd.enabled

- name: Stop and disable systemd-oomd when it is turned off
  ansible.builtin.systemd_service:
    name: systemd-oomd
    enabled: false
    state: stopped
  when: not devbox_host.oomd.enabled
  # oomd may never have been installed if it was always off, and stopping/disabling a
  # unit that does not exist is the only failure this should swallow. The reconcile
  # above already cleared the set-property override regardless of whether this task
  # succeeds, so a real systemd/D-Bus failure here leaves the slices correctly
  # configured either way; we accept mirroring resource_limits' precedent rather than
  # adding a stat-based existence check.
  failed_when: false
