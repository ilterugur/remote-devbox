---
# The box-side `devbox` command: what a developer types once they are on the box. It
# reads the same generated data the roles consumed, so it can never disagree with them
# about which engine, bank or slice applies.

- name: Ensure the box data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/remote-devbox
    - /usr/local/share/remote-devbox

- name: Select the box doctor build target
  ansible.builtin.set_fact:
    _devbox_doctor_target: >-
      {{ {'amd64': 'linux-x64', 'arm64': 'linux-arm64'}[devbox_platform.architecture] }}

- name: Build the box doctor for the declared host architecture
  ansible.builtin.command:
    argv:
      - /bin/sh
      - "{{ playbook_dir }}/../scripts/build-box-doctor.sh"
      - "{{ _devbox_doctor_target }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: _devbox_doctor_build
  changed_when: "'built' in _devbox_doctor_build.stdout"

- name: Ensure the private executable directory exists
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the box health collector
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../box/doctor/dist/remote-devbox-doctor-{{ _devbox_doctor_target }}"
    dest: /usr/local/libexec/remote-devbox-doctor
    owner: root
    group: root
    mode: "0755"
  notify: Refresh box health snapshot

- name: Publish sanitized desired health components
  ansible.builtin.template:
    src: health-components.json.j2
    dest: /etc/remote-devbox/health-components.json
    owner: root
    group: root
    mode: "0644"
  notify: Refresh box health snapshot

- name: Install the root health snapshot service
  ansible.builtin.template:
    src: devbox-health-snapshot.service.j2
    dest: /etc/systemd/system/devbox-health-snapshot.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for box health
    - Refresh box health snapshot

- name: Install the root health snapshot timer
  ansible.builtin.template:
    src: devbox-health-snapshot.timer.j2
    dest: /etc/systemd/system/devbox-health-snapshot.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for box health
    - Restart box health snapshot timer
    - Refresh box health snapshot

- name: Enable the bounded health snapshot timer
  ansible.builtin.systemd_service:
    name: devbox-health-snapshot.timer
    enabled: true
    state: started
    daemon_reload: true
  # First-install check mode does not write the new unit file, so systemd cannot
  # discover it. Template diffs still show the pending change; the real run writes
  # the unit before this task and enables it normally.
  when: not ansible_check_mode

- name: Install the box CLI
  ansible.builtin.template:
    src: devbox-cli.sh.j2
    dest: /usr/local/bin/devbox
    owner: root
    group: root
    mode: "0755"

- name: Publish the client CLI binaries
  ansible.builtin.import_tasks: client_binaries.yml

# Handed out by `devbox client-config`, never run on the box: it is the client that has
# to decide, per connection, whether the tailnet is a usable route to here.
- name: Stage the client-side tailnet probe
  ansible.builtin.copy:
    src: devbox-tailnet-up
    dest: /usr/local/share/remote-devbox/devbox-tailnet-up
    owner: root
    group: root
    mode: "0644"

# The client's `devbox` itself: a dispatcher that keeps the tailnet probe in sh and hands
# every other subcommand to the compiled binary. Handed out, never run here.
- name: Stage the client-side command dispatcher
  ansible.builtin.copy:
    src: devbox-dispatch
    dest: /usr/local/share/remote-devbox/devbox-dispatch
    owner: root
    group: root
    mode: "0644"

# Everything `devbox client-config` needs to describe this box to a laptop, written once
# here so the CLI looks it up instead of re-deriving addresses at runtime — the same rule
# the engine map follows.
- name: Publish the client connection facts
  ansible.builtin.copy:
    dest: /etc/remote-devbox/client.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ _devbox_client_facts | to_nice_json }}\n"
  vars:
    _devbox_client_facts:
      prefix: "{{ devbox_client_prefix }}"
      # What the operator connects to, so a box behind NAT advertises the address that
      # actually works rather than a private one it happens to hold.
      public_host: "{{ ansible_host | default(ansible_facts.default_ipv4.address) }}"
      tailnet_host: "{{ ansible_facts.tailscale0.ipv4.address | default('') }}"
      locale: "{{ devbox_host.locales[0] }}"
      # Every account that can log in, not just the developers: the operator connects
      # too, and an alias the box cannot describe is one somebody has to hand-write.
      # Built through named vars because a filter binds tighter than `+` in Jinja, so the
      # inline form silently zipped the wrong two lists.
      accounts: "{{ dict(_devbox_account_names | zip(_devbox_account_projects)) }}"
      # The file bridge and app configs a client needs to drive its own sync disk. Keyed
      # by developer only — the operator account never syncs — so a client without a repo
      # checkout can still manage them instead of reporting the feature as switched off.
      file_bridges: "{{ dict(_devbox_developer_names | zip(devbox_developers | map(attribute='file_bridge') | list)) }}"
      app_configs: "{{ dict(_devbox_developer_names | zip(devbox_developers | map(attribute='app_configs') | list)) }}"
      # The client side of the desktop tunnel. Keyed by developer, and only for the ones
      # who have a desktop — a client with no repo checkout cannot work the port out on
      # its own, and guessing 3389 would collide the moment a second developer appears.
      desktops: "{{ dict(_devbox_developer_names | zip(devbox_developers | map(attribute='desktop') | list)) }}"
      # A single loopback-only CDP endpoint exists only when failover is explicitly
      # enabled. The emitted client config later exposes it solely to chrome_user.
      browser_failover: "{{ devbox_browser.failover }}"
      # The metrics dashboard, box-level: one agent serves the whole host, so the client
      # publishes exactly one forward for it. `access` travels along because only
      # "tunnel" makes the box bind loopback, and a forward to nothing is worth warning
      # about at describe time rather than discovering as a refused connection.
      monitoring: "{{ devbox_host.monitoring | default({'enabled': false}, true) }}"
    _devbox_developer_names: "{{ devbox_developers | map(attribute='user') | list }}"
    _devbox_account_names: "{{ [devbox_operator.user] + _devbox_developer_names }}"
    _devbox_account_projects: "{{ [[]] + (devbox_developers | map(attribute='projects') | list) }}"
