---
# Server-side, headless browser use for the agent: install Google Chrome once, run one
# Playwright MCP server (navigate/click/snapshot, console + network) per developer that
# asked for it (developers[].browser), and wire each of them into their own. Runs against
# the system Chrome headless. This is NOT "Claude in Chrome" (that extension is
# client-side, on your client).
#
# chrome-devtools-mcp is retired — see wire-browser-mcp.py for why.

- name: Install supporting fonts for headless Chrome rendering
  ansible.builtin.apt:
    name:
      - fonts-liberation
      - fonts-noto-core
      - fonts-noto-color-emoji
      - dbus-x11
    state: present
    update_cache: true

- name: Check whether Google Chrome is already installed
  ansible.builtin.stat:
    path: /usr/bin/google-chrome-stable
  register: _chrome_bin

# Install from the official .deb so Chrome self-manages its own apt repo/key — we
# never add a repo ourselves (doing so collides with Chrome's own google-chrome.sources).
- name: Install Google Chrome from the official .deb (pulls deps + its own repo)
  when: not _chrome_bin.stat.exists
  block:
    - name: Download the current Google Chrome .deb
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        dest: /tmp/google-chrome-stable_current_amd64.deb
        mode: "0644"

    - name: Install the Google Chrome .deb
      ansible.builtin.apt:
        deb: /tmp/google-chrome-stable_current_amd64.deb
        state: present

    - name: Remove the downloaded .deb
      ansible.builtin.file:
        path: /tmp/google-chrome-stable_current_amd64.deb
        state: absent

- name: Install the browser MCP wiring script
  ansible.builtin.copy:
    src: wire-browser-mcp.py
    dest: /usr/local/bin/wire-browser-mcp
    owner: root
    group: root
    mode: "0755"

- name: Set up the CDP failover endpoint (HAProxy + fallback Chrome)
  ansible.builtin.include_tasks: failover.yml
  when: devbox_browser.failover.enabled

# Everything below runs AFTER the failover include on purpose: with failover on, each
# MCP server is started with --cdp-endpoint pointing at the endpoint that include puts
# there. On a fresh box HAProxy is not installed until it runs, so a server started
# first would attach to nothing.

# A box that ran an earlier revision of this role has one box-wide unit holding the
# base port. Left in place it would keep running and the first developer's server
# would fail to bind.
- name: Retire the box-wide playwright MCP service if present
  ansible.builtin.systemd_service:
    name: devbox-playwright-mcp.service
    state: stopped
    enabled: false
  failed_when: false

- name: Delete the box-wide unit file
  ansible.builtin.file:
    path: /etc/systemd/system/devbox-playwright-mcp.service
    state: absent
  notify: Reload systemd

# One unit per browser-enabled developer, each running as that developer on the port
# the generator assigned them (devbox_browser.servers) — see browser-ports.ts for why
# the account and the port are decided there and not here.
- name: Install a playwright MCP service per browser-enabled developer
  ansible.builtin.template:
    src: devbox-playwright-mcp.service.j2
    dest: "/etc/systemd/system/devbox-playwright-mcp-{{ server.user }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ devbox_browser.servers }}"
  loop_control:
    loop_var: server
    label: "{{ server.user }}"
  register: mcp_units
  when: devbox_browser.enabled

# A changed unit definition (port, failover mode, ...) has to actually reach the running
# process, not just sit on disk until someone restarts it by hand — so a unit whose file
# changed is restarted, and only that one. daemon_reload rides in the same task rather
# than in a separately notified handler: handler order is not guaranteed, and a restart
# that runs before the reload silently keeps the old command line running.
- name: Enable and start each developer's playwright MCP service
  ansible.builtin.systemd_service:
    name: "devbox-playwright-mcp-{{ unit.server.user }}.service"
    enabled: true
    state: "{{ 'restarted' if unit.changed else 'started' }}"
    daemon_reload: true
  loop: "{{ mcp_units.results }}"
  loop_control:
    loop_var: unit
    label: "{{ unit.server.user }}"
  when: devbox_browser.enabled

# Reconciles only the browser entries in each developer's agent config; every other
# mcpServers entry is preserved. Every session that developer runs attaches to their own
# HTTP server instead of spawning one per session — their own, not a shared one, because
# the server reads and writes files as the account it runs as. The URL says "localhost",
# not an IP literal, because playwright-mcp itself only accepts requests whose Host
# header is "localhost:<port>" (see devbox-playwright-mcp.service.j2) — the unit's --host
# and this URL must agree.
- name: Wire each developer into their own browser MCP server
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/bin/wire-browser-mcp', '--config', '/home/' ~ server.user ~ '/.claude.json',
          '--playwright-url', 'http://localhost:' ~ server.port ~ '/mcp'] }}
  become: true
  become_user: "{{ server.user }}"
  environment:
    HOME: "/home/{{ server.user }}"
  loop: "{{ devbox_browser.servers }}"
  loop_control:
    loop_var: server
    label: "{{ server.user }}"
  changed_when: false

# ── Orphan-browser reaper ─────────────────────────────────────────────────────
# Chrome outlives the agent session that spawned it: when an omp/codex session dies,
# its automation browser is reparented to `systemd --user` and keeps its full heap.
# Fifteen of those cost this box 20.5 GB and pushed it into swap. One box-wide timer
# sweeps them all, because a single pass over /proc already sees every developer's.
- name: Deploy the orphan-browser reaper (python, driven by its own timer)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/orphan-browser-reap.py"
    dest: /usr/local/bin/orphan-browser-reap
    owner: root
    group: root
    mode: "0755"

- name: Write the orphan-browser reaper unit and timer
  ansible.builtin.template:
    src: "orphan-browser-reap.{{ item }}.j2"
    dest: "/etc/systemd/system/orphan-browser-reap.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  when: devbox_browser.reap.enabled
  notify: Reload systemd

# In check mode the unit files above were never written, so systemd cannot be asked
# to enable a timer it has no file for — the guard keeps `apply --check` a report
# rather than a failure. Same convention as the box_cli and desktop roles.
- name: Enable the orphan-browser reaper timer
  ansible.builtin.systemd_service:
    name: orphan-browser-reap.timer
    state: started
    enabled: true
    daemon_reload: true
  when:
    - devbox_browser.reap.enabled
    - not ansible_check_mode

# Stop before removing: a timer whose unit files vanish underneath it stays loaded
# and armed in the running manager until something reloads it.
- name: Stop the orphan-browser reaper timer when reaping is disabled
  ansible.builtin.systemd_service:
    name: orphan-browser-reap.timer
    state: stopped
    enabled: false
  failed_when: false
  when: not devbox_browser.reap.enabled

- name: Remove the orphan-browser reaper unit and timer when reaping is disabled
  ansible.builtin.file:
    path: "/etc/systemd/system/orphan-browser-reap.{{ item }}"
    state: absent
  loop: [service, timer]
  when: not devbox_browser.reap.enabled
  notify: Reload systemd
