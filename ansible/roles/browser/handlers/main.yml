- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: reloaded

- name: Restart the shared playwright MCP service
  # daemon_reload here, not just in the separately-notified "Reload systemd" handler:
  # handler notification order is not guaranteed, so a restart could run before that
  # reload has picked up the changed unit file — which restarts the process against
  # the stale definition and silently keeps the old command line running. Doing both
  # atomically in the same task is the only way this handler is guaranteed correct.
  ansible.builtin.systemd_service:
    name: devbox-playwright-mcp
    daemon_reload: true
    state: restarted
