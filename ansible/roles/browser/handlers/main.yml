- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload haproxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: reloaded

- name: Restart the shared playwright MCP service
  ansible.builtin.systemd_service:
    name: devbox-playwright-mcp
    state: restarted
