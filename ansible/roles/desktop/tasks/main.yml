---
# A full Linux desktop for the developers that ask for one. XFCE and xRDP are installed
# once on the host; each developer gets their own Xorg session, inside their own resource
# slice, so a heavy browser is charged to the person running it.
#
# The transport is deliberately NOT public. RDP has a long history of being scanned and
# brute-forced, and unlike sshd it authenticates with a PAM password rather than a key.
# Tailnet-only is the default and the firewall enforces it.

- name: Work out which developers asked for a desktop
  ansible.builtin.set_fact:
    _devbox_desktop_users: "{{ devbox_developers | selectattr('desktop.enabled') | list }}"

# xrdp is one host-level service, so its listen set is the union across everyone who
# asked for a desktop — not a per-developer choice.
- name: Work out how the desktop must be reachable
  ansible.builtin.set_fact:
    _devbox_desktop_access: >-
      {{ _devbox_desktop_users | map(attribute='desktop.access') | flatten | unique | list }}

- name: Install XFCE and xRDP
  ansible.builtin.apt:
    name:
      - xfce4
      - xfce4-terminal
      - xrdp
      - dbus-x11
      - xorgxrdp
    state: present
    update_cache: true
  when: _devbox_desktop_users | length > 0

- name: Start each session in XFCE
  ansible.builtin.copy:
    dest: "/home/{{ item.user }}/.xsession"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0700"
    content: |
      # Managed by Ansible (remote-devbox).
      exec startxfce4
  loop: "{{ _devbox_desktop_users }}"
  loop_control:
    label: "{{ item.user }}"

# xrdp runs as its own user and needs to read the session certificate; it does NOT need
# to read anybody's home, so it stays out of the developers' groups.
- name: Configure xRDP
  ansible.builtin.template:
    src: xrdp.ini.j2
    dest: /etc/xrdp/xrdp.ini
    owner: root
    group: root
    mode: "0644"
  when: _devbox_desktop_users | length > 0
  notify: Restart xrdp

- name: Drop disconnected sessions after the configured idle time
  ansible.builtin.template:
    src: sesman.ini.j2
    dest: /etc/xrdp/sesman.ini
    owner: root
    group: root
    mode: "0644"
  when: _devbox_desktop_users | length > 0
  notify: Restart xrdp

- name: Enable xRDP
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - xrdp.service
    - xrdp-sesman.service
  when: _devbox_desktop_users | length > 0

# RDP authenticates against a PAM password, so a desktop developer must have one. The
# hash comes from the secrets file — never a plaintext password, never a generated one
# that would change on every apply.
- name: Set the RDP password for each desktop developer
  ansible.builtin.user:
    name: "{{ item.user }}"
    password: "{{ devbox_secrets['RDP_PASSWORD_HASH_' ~ (item.user | upper | replace('-', '_'))] }}"
  loop: "{{ _devbox_desktop_users }}"
  loop_control:
    label: "{{ item.user }}"
  when: >-
    ('RDP_PASSWORD_HASH_' ~ (item.user | upper | replace('-', '_'))) in devbox_secrets
  no_log: true

- name: Warn about desktop developers with no RDP password
  ansible.builtin.debug:
    msg: >-
      {{ item.user }} has desktop.enabled but no
      RDP_PASSWORD_HASH_{{ item.user | upper | replace('-', '_') }} in devbox.secrets.yml —
      they cannot log in over RDP. Generate one with:
      openssl passwd -6
  loop: "{{ _devbox_desktop_users }}"
  loop_control:
    label: "{{ item.user }}"
  when: >-
    ('RDP_PASSWORD_HASH_' ~ (item.user | upper | replace('-', '_'))) not in devbox_secrets

# Password login over SSH stays off regardless: the RDP password is for the RDP PAM
# stack only, and sshd must not start accepting it.
- name: Assert SSH password authentication is still disabled
  ansible.builtin.command: sshd -T
  changed_when: false
  register: _devbox_sshd_effective
  when: _devbox_desktop_users | length > 0

- name: Fail if setting an RDP password re-enabled SSH passwords
  ansible.builtin.assert:
    that: "'passwordauthentication no' in (_devbox_sshd_effective.stdout | lower)"
    fail_msg: >-
      Developers now have PAM passwords for RDP and sshd accepts password auth — that
      combination turns a leaked desktop password into full SSH access. Re-run the
      security role.
  when: _devbox_desktop_users | length > 0

- name: Allow RDP over the tailnet
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
    interface: tailscale0
    direction: in
    comment: "xrdp over the tailnet"
  when: "'tailnet' in _devbox_desktop_access"

# Deliberately spelled out rather than reached by a boolean: this is the one path that
# puts a password-authenticated service on the public internet.
- name: Allow RDP from anywhere (unsafe-public)
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
    comment: "xrdp UNSAFE-PUBLIC — password-authenticated service on the internet"
  when: "'unsafe-public' in _devbox_desktop_access"

- name: Remove a stale public RDP rule
  # ufw only adds rules, so a box that once allowed 3389 publicly keeps that rule until
  # it is deleted. Leaving it would silently defeat a later switch back to tunnel-only.
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
    delete: true
  when: "'unsafe-public' not in _devbox_desktop_access"
  failed_when: false

- name: Remove a stale tailnet RDP rule
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
    interface: tailscale0
    direction: in
    delete: true
  when: "'tailnet' not in _devbox_desktop_access"
  failed_when: false

# xrdp binds interfaces by name at startup, so a tailnet listener needs tailscale0 to
# already exist — otherwise the bind fails and the service comes up reachable only on
# whatever else was listed.
- name: Ensure the xrdp drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/xrdp.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'tailnet' in _devbox_desktop_access"

- name: Start xrdp after the tailnet is up
  ansible.builtin.copy:
    dest: /etc/systemd/system/xrdp.service.d/10-devbox-after-tailscaled.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (remote-devbox).
      [Unit]
      After=tailscaled.service
      Wants=tailscaled.service
  when: "'tailnet' in _devbox_desktop_access"
  notify: Restart xrdp

- name: Teach fail2ban what an xrdp login failure looks like
  # fail2ban ships no xrdp filter on Ubuntu, so a jail alone would silently not exist.
  ansible.builtin.copy:
    dest: /etc/fail2ban/filter.d/devbox-xrdp.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (remote-devbox).
      [Definition]
      failregex = ^.*\[ERROR\] login failed for user .* from <HOST>.*$
                  ^.*AUTHFAIL.*client_ip=<HOST>.*$
                  ^.*\[INFO \] Login failed for display .*client_ip=<HOST>.*$
      ignoreregex =

- name: Watch xrdp for password guessing
  # fail2ban shipped with an sshd jail only, so the one password-authenticated service on
  # the box was the one nobody was counting failures for.
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/devbox-xrdp.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (remote-devbox).
      [devbox-xrdp]
      enabled  = true
      filter   = devbox-xrdp
      port     = 3389
      logpath  = /var/log/xrdp-sesman.log
                 /var/log/xrdp.log
      backend  = auto
      maxretry = 4
      findtime = 600
      bantime  = 3600
  when: _devbox_desktop_users | length > 0
  notify: Restart fail2ban

- name: Report how the desktop is reachable
  ansible.builtin.debug:
    msg: >-
      Desktop listens via {{ _devbox_desktop_access | join(', ') }}.
      {% if 'tunnel' in _devbox_desktop_access %}
      Tunnel: ssh -L 3389:127.0.0.1:3389 <developer>@<box>, then point the RDP client at
      localhost:3389.
      {% endif %}
      {% if 'unsafe-public' in _devbox_desktop_access %}
      WARNING: unsafe-public is set — the RDP password is now internet-facing.
      {% endif %}
  when: _devbox_desktop_users | length > 0
