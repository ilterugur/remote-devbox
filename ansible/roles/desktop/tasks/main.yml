---
# A full Linux desktop for the developers that ask for one. XFCE and xRDP are installed
# once on the host; each developer gets their own Xorg session, inside their own resource
# slice, so a heavy browser is charged to the person running it.
#
# The transport is deliberately NOT public. RDP has a long history of being scanned and
# brute-forced, and unlike sshd it authenticates with a PAM password rather than a key.
# Tailnet-only is the default and the firewall enforces it.

- name: Work out which developers asked for a desktop
  ansible.builtin.set_fact:
    _devbox_desktop_users: "{{ devbox_developers | selectattr('desktop.enabled') | list }}"
    # sesman gates RDP on one group name, so the "who may open a session" list has to
    # exist as a real group on the box rather than as a list in a config file.
    _devbox_desktop_group: devbox-rdp

# xrdp is one host-level service, so its listen set is the union across everyone who
# asked for a desktop — not a per-developer choice.
- name: Work out how the desktop must be reachable
  ansible.builtin.set_fact:
    _devbox_desktop_access: >-
      {{ _devbox_desktop_users | map(attribute='desktop.access') | flatten | unique | list }}

- name: Install XFCE and xRDP
  ansible.builtin.apt:
    name:
      - xfce4
      - xfce4-terminal
      - xrdp
      - dbus-x11
      - xorgxrdp
    state: present
    update_cache: true
  when: _devbox_desktop_users | length > 0

- name: Create the group that gates RDP
  ansible.builtin.group:
    name: "{{ _devbox_desktop_group }}"
    state: present
  when: _devbox_desktop_users | length > 0

- name: Let the desktop developers open an RDP session
  ansible.builtin.user:
    name: "{{ item.user }}"
    groups: "{{ _devbox_desktop_group }}"
    append: true
  loop: "{{ _devbox_desktop_users }}"
  loop_control:
    label: "{{ item.user }}"

- name: Read who is currently in the RDP group
  ansible.builtin.getent:
    database: group
    key: "{{ _devbox_desktop_group }}"
  when: _devbox_desktop_users | length > 0

# A gate that only ever adds is not a gate: turning desktop.enabled off would otherwise
# leave the account able to open a session until somebody noticed.
- name: Take RDP away from developers who no longer ask for a desktop
  ansible.builtin.command:
    cmd: "gpasswd --delete {{ item }} {{ _devbox_desktop_group }}"
  loop: >-
    {{ (ansible_facts.getent_group[_devbox_desktop_group][2] | default('')).split(',')
       | select | difference(_devbox_desktop_users | map(attribute='user') | list) }}
  changed_when: true
  when: _devbox_desktop_users | length > 0

- name: Start each session in XFCE
  ansible.builtin.template:
    src: xsession.j2
    dest: "/home/{{ item.user }}/.xsession"
    owner: "{{ item.user }}"
    group: "{{ item.user }}"
    mode: "0700"
  loop: "{{ _devbox_desktop_users }}"
  loop_control:
    label: "{{ item.user }}"

# The keyboard belongs to xrdp, not to the session: xrdp maps the layout id the client
# announces to an X11 layout through this file and applies it AFTER the session script
# has run. Its shipped table has holes — Turkish among them — and an unmapped id becomes
# `us` with only a debug line to say so, which is how a Turkish keyboard ends up typing
# in English. Only the layouts this box's developers actually use are added.
- name: Work out which keyboards xrdp has to be taught
  ansible.builtin.set_fact:
    _devbox_desktop_keyboards: >-
      {{ _devbox_desktop_users | map(attribute='desktop.keyboard') | reject('none')
         | rejectattr('rdp_layout_id', 'none') | unique | list }}

- name: Teach xrdp the RDP layout ids it has no mapping for
  community.general.ini_file:
    path: /etc/xrdp/xrdp_keyboard.ini
    section: default_rdp_layouts
    option: "rdp_layout_{{ item.layout }}{{ '_' ~ item.variant if item.variant else '' }}"
    value: "{{ item.rdp_layout_id }}"
    no_extra_spaces: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _devbox_desktop_keyboards }}"
  loop_control:
    label: "{{ item.layout }}{{ '(' ~ item.variant ~ ')' if item.variant else '' }}"
  notify: Restart xrdp

# Both maps: a client that reports itself as a Mac keyboard (type 4, subtype 3) is served
# from the mac table, everything else from the default one. Teaching only one of them
# would fix the desktop for one client and leave it in English on another.
- name: Map those ids onto the X11 layouts they mean
  community.general.ini_file:
    path: /etc/xrdp/xrdp_keyboard.ini
    section: "{{ item.1 }}"
    option: "rdp_layout_{{ item.0.layout }}{{ '_' ~ item.0.variant if item.0.variant else '' }}"
    value: "{{ item.0.layout }}{{ '(' ~ item.0.variant ~ ')' if item.0.variant else '' }}"
    no_extra_spaces: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _devbox_desktop_keyboards | product(['default_layouts_map', 'rdp_layouts_map_mac']) | list }}"
  loop_control:
    label: "{{ item.1 }}: {{ item.0.layout }}"
  notify: Restart xrdp

# Restarting xrdp always takes the session manager with it: xrdp-sesman ships
# BindsTo=xrdp.service, and that cannot be undone by a drop-in — systemd does not reset
# BindsTo on an empty assignment (measured, not assumed), so the only override would be a
# full copy of the packaged unit, which then silently drifts on upgrade. Since sesman
# keeps its session list in memory, every restart abandons the open desktops instead.
# That is why .xsession reaps abandoned sessions at login: the recovery is automatic
# rather than prevented.
- name: Remove the drop-in that tried to prevent it
  # It was ineffective, and config that looks like a guarantee but isn't is worse than
  # none — the next person would trust it.
  ansible.builtin.file:
    path: /etc/systemd/system/xrdp-sesman.service.d/10-devbox-keep-sessions.conf
    state: absent
  notify: Reload systemd

# xrdp runs as its own user and needs to read the session certificate; it does NOT need
# to read anybody's home, so it stays out of the developers' groups.
- name: Configure xRDP
  ansible.builtin.template:
    src: xrdp.ini.j2
    dest: /etc/xrdp/xrdp.ini
    owner: root
    group: root
    mode: "0644"
  when: _devbox_desktop_users | length > 0
  notify: Restart xrdp

- name: Drop disconnected sessions after the configured idle time
  ansible.builtin.template:
    src: sesman.ini.j2
    dest: /etc/xrdp/sesman.ini
    owner: root
    group: root
    mode: "0644"
  when: _devbox_desktop_users | length > 0
  # The one change that has to bounce the session manager, and so the one that costs
  # every open desktop its session. Everything else reloads xrdp alone.
  notify: Restart xrdp-sesman

# xrdp resolves every configured bind address while it starts. `tailscaled.service`
# being active does not mean tailscale0 has an address yet, so the unit must depend on
# Tailscale's readiness target whenever it binds the tailnet. The restart policy is a
# second, bounded safety net for readiness changing between the target and the bind.
- name: Ensure the xrdp drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/xrdp.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: _devbox_desktop_users | length > 0

- name: Configure xrdp dependency readiness and failed-start recovery
  ansible.builtin.template:
    src: xrdp-recovery.conf.j2
    dest: /etc/systemd/system/xrdp.service.d/10-devbox-recovery.conf
    owner: root
    group: root
    mode: "0644"
  when: _devbox_desktop_users | length > 0
  notify:
    - Reload systemd
    - Restart xrdp

- name: Remove the obsolete tailscaled-service-only xrdp dependency
  ansible.builtin.file:
    path: /etc/systemd/system/xrdp.service.d/10-devbox-after-tailscaled.conf
    state: absent
  notify: Reload systemd

- name: Remove xrdp recovery policy when no desktop is declared
  ansible.builtin.file:
    path: /etc/systemd/system/xrdp.service.d/10-devbox-recovery.conf
    state: absent
  when: _devbox_desktop_users | length == 0
  notify: Reload systemd

# A first install can otherwise try to start xrdp before systemd has loaded the new
# dependency. Handler order guarantees daemon-reload runs before the xrdp restart.
- name: Apply xrdp unit policy before enabling the service
  ansible.builtin.meta: flush_handlers

- name: Enable xRDP
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - xrdp.service
    - xrdp-sesman.service
  when: _devbox_desktop_users | length > 0

# RDP authenticates against a PAM password, so a desktop developer must have one. The
# hash comes from the secrets file — never a plaintext password, never a generated one
# that would change on every apply.
- name: Set the RDP password for each desktop developer
  ansible.builtin.user:
    name: "{{ item.user }}"
    password: "{{ devbox_secrets['RDP_PASSWORD_HASH_' ~ (item.user | upper | replace('-', '_'))] }}"
  loop: "{{ _devbox_desktop_users }}"
  loop_control:
    label: "{{ item.user }}"
  when: >-
    ('RDP_PASSWORD_HASH_' ~ (item.user | upper | replace('-', '_'))) in devbox_secrets
  no_log: true

- name: Warn about desktop developers with no RDP password
  ansible.builtin.debug:
    msg: >-
      {{ item.user }} has desktop.enabled but no
      RDP_PASSWORD_HASH_{{ item.user | upper | replace('-', '_') }} in devbox.secrets.yml —
      they cannot log in over RDP. Generate one with:
      openssl passwd -6
  loop: "{{ _devbox_desktop_users }}"
  loop_control:
    label: "{{ item.user }}"
  when: >-
    ('RDP_PASSWORD_HASH_' ~ (item.user | upper | replace('-', '_'))) not in devbox_secrets

# Password login over SSH stays off regardless: the RDP password is for the RDP PAM
# stack only, and sshd must not start accepting it.
- name: Assert SSH password authentication is still disabled
  ansible.builtin.command: sshd -T
  changed_when: false
  # Reading the effective sshd config changes nothing, and skipping it under --check
  # would leave the assert below comparing against an empty string — turning every dry
  # run into a false report that password login had been re-enabled.
  check_mode: false
  register: _devbox_sshd_effective
  when: _devbox_desktop_users | length > 0

- name: Fail if setting an RDP password re-enabled SSH passwords
  ansible.builtin.assert:
    that: "'passwordauthentication no' in (_devbox_sshd_effective.stdout | lower)"
    fail_msg: >-
      Developers now have PAM passwords for RDP and sshd accepts password auth — that
      combination turns a leaked desktop password into full SSH access. Re-run the
      security role.
  when: _devbox_desktop_users | length > 0

- name: Allow RDP over the tailnet
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
    interface: tailscale0
    direction: in
    comment: "xrdp over the tailnet"
  when: "'tailnet' in _devbox_desktop_access"

# Deliberately spelled out rather than reached by a boolean: this is the one path that
# puts a password-authenticated service on the public internet.
- name: Allow RDP from anywhere (unsafe-public)
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
    comment: "xrdp UNSAFE-PUBLIC — password-authenticated service on the internet"
  when: "'unsafe-public' in _devbox_desktop_access"

- name: Remove a stale public RDP rule
  # ufw only adds rules, so a box that once allowed 3389 publicly keeps that rule until
  # it is deleted. Leaving it would silently defeat a later switch back to tunnel-only.
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
    delete: true
  when: "'unsafe-public' not in _devbox_desktop_access"
  failed_when: false

- name: Remove a stale tailnet RDP rule
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
    interface: tailscale0
    direction: in
    delete: true
  when: "'tailnet' not in _devbox_desktop_access"
  failed_when: false

- name: Teach fail2ban what an xrdp login failure looks like
  # fail2ban ships no xrdp filter on Ubuntu, so a jail alone would silently not exist.
  ansible.builtin.copy:
    dest: /etc/fail2ban/filter.d/devbox-xrdp.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (remote-devbox).
      [Definition]
      failregex = ^.*\[ERROR\] login failed for user .* from <HOST>.*$
                  ^.*AUTHFAIL.*client_ip=<HOST>.*$
                  ^.*\[INFO \] Login failed for display .*client_ip=<HOST>.*$
      ignoreregex =

- name: Watch xrdp for password guessing
  # fail2ban shipped with an sshd jail only, so the one password-authenticated service on
  # the box was the one nobody was counting failures for.
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/devbox-xrdp.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (remote-devbox).
      [devbox-xrdp]
      enabled  = true
      filter   = devbox-xrdp
      port     = 3389
      logpath  = /var/log/xrdp-sesman.log
                 /var/log/xrdp.log
      backend  = auto
      maxretry = 4
      findtime = 600
      bantime  = 3600
  when: _devbox_desktop_users | length > 0
  notify: Restart fail2ban

- name: Report how the desktop is reachable
  ansible.builtin.debug:
    msg: >-
      Desktop listens via {{ _devbox_desktop_access | join(', ') }}.
      {% if 'tunnel' in _devbox_desktop_access %}
      Tunnel: ssh -L 3389:127.0.0.1:3389 <developer>@<box>, then point the RDP client at
      localhost:3389.
      {% endif %}
      {% if 'unsafe-public' in _devbox_desktop_access %}
      WARNING: unsafe-public is set — the RDP password is now internet-facing.
      {% endif %}
  when: _devbox_desktop_users | length > 0
