---
# ============================================================================
#  remote-devbox canonical configuration
#
#    cp devbox.example.yml devbox.yml   # devbox.yml is gitignored — real values
#    devbox plan                        # validate + show the resolved plan
#
#  A DEVELOPER is a real human with their own Linux account. Underneath a
#  developer, git identities, agent profiles, memory spaces and container
#  engines are INDEPENDENT dimensions — a project picks any combination.
#
#  Everything below is a placeholder. Never commit real names, hosts or keys.
# ============================================================================

config_version: 3

# The only supported target. Set allow_unsupported_platform: true to override
# (loud warning, unsupported).
platform:
  distribution: ubuntu
  version: "26.04"
  architecture: amd64

# Host tuning — nothing here is part of the developer model.
host:
  # Weight-mode arithmetic subtracts this from physical RAM before dividing the pool.
  # It does not enforce an OS/systemd/cgroup reservation by itself.
  memory_reserve: 4G
  # Serialize selected heavy command families per Linux developer.
  heavy_job_gate:
    enabled: true
    categories:
      build: true
      typecheck: true
      generate: true
      test: true
    wait_timeout_sec: 1800 # 0 waits forever; timeout exits the queued command with status 75.
    warn_after_sec: 5     # 0 reports queuing immediately.
    # Ceiling for ONE gated job. The queue above bounds how many run at once; this
    # bounds how large one gets. A single tsc reaching its agent host's whole budget
    # does not die there — MemoryHigh throttles instead of killing — so the host stalls
    # and every session sharing that cgroup drops. Each gated job runs in a scope of
    # its own, so a runaway is the only casualty. '' disables the scope.
    memory_max: 8G
  swap_size: 8G
  # Size bound for the tmpfs behind /tmp. Everything written there is resident memory
  # that can only be swapped, never dropped, and the distro default is half of RAM —
  # which is not a bound. Over the wall a job gets ENOSPC and fails alone, instead of
  # quietly spending memory the whole box needs. Accepts '4G' or a percentage '10%'.
  tmp_size: 4G
  zram:
    enabled: true
    percent: 25
  locales:
    # Keep en_US.UTF-8 first: a Turkish working locale’s dotless-i breaks build tools.
    - en_US.UTF-8
  mosh: true              # roaming-resilient terminal (UDP, scoped to the tailnet)
  eternal_terminal: false # TCP alternative to mosh, without its predictive echo
  harden_ssh: true        # false adopts an existing box without touching sshd
  github_cli: true        # `gh` from GitHub's own apt repo (Ubuntu's is ~2 years behind)
  hide_pids: true         # /proc hidepid: developers cannot see each other’s command lines
  umask: "077"
  # Left at the kernel default (60) when unset. Lower it on a box that mostly compiles:
  # build heaps then stay resident instead of being paged into zram, which lives in RAM
  # and so would double-count against memory rather than relieve it.
  # swappiness: 10
  # Kills below each developer's user manager under sustained memory pressure so editor
  # servers and user services cannot park the box in reclaim thrash. Login/desktop
  # scopes remain contained by the developer slice's hard memory and swap ceilings.
  # oomd:
  #   enabled: true
  #   memory_pressure_limit: 60%      # per developer user manager
  #   memory_pressure_duration_sec: 20

# Shared toolchain, installed once via mise and resolved on every developer PATH.
runtimes:
  node: lts
  python: "3.12"
  bun: latest
  uv: latest

# Maintenance account: sudo, runs Ansible. NOT a developer account.
operator:
  user: devbox-admin
  ssh_authorized_keys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5REPLACEME operator@client"
  # Client-side key used for the pre-hardening login probe.
  private_key_path: "~/.ssh/id_ed25519"

network:
  tailscale:
    enabled: true
  # Which paths sshd listens on. Key-only either way — Tailscale is a network layer,
  # not authentication. Defaults to public plus tailnet when Tailscale is on; a public
  # path is kept deliberately so a Tailscale outage cannot lock you out.
  ssh:
    access: [public, tailnet]

# Rootless engines, per developer. Both can be installed side by side; their
# image/volume stores are separate and switching never migrates or deletes data.
container:
  default_engine: podman-rootless
  install_engines:
    - podman-rootless
    - docker-rootless

# System Docker is operator-owned only — developers are never in the docker group.
shared_services:
  enabled: false
  engine: system-docker

# ── Server-side browser ───────────────────────────────────────────────────────
# Headless Chrome plus the Playwright MCP server that drives it, in the agent config of
# every developer that opts in below.
# This is NOT the client-side "Claude in Chrome" extension.
#
# failover: instead of each MCP launching its own headless Chrome, they attach to one
# CDP endpoint — the client's real browser through a reverse tunnel while it is
# online, and a box-local Chrome when it is not. chrome_user names the account that
# box-local Chrome runs as; it is required, because "whichever developer came first"
# is not something anyone should have to read the generated config to discover.
# It also selects the only client profile allowed to start the local Chrome and reverse
# tunnel. Use a dedicated, low-risk account: CDP can control that browser profile.
# After enabling it, the operator runs `devbox apply browser`; that provisions the box
# endpoint and also publishes the current client CLI because the box_cli role has
# Ansible's `always` tag. On the named client, fetch the generated installer through
# `ssh devbox-<chrome_user> 'devbox client-config --installer' > "$installer"` into a
# local temporary file, inspect it, and run it to refresh both the binary and client
# config. Only then run `devbox agent up -p <chrome_user>` to start the ownership-coupled
# browser supervisor.
# browser:
#   enabled: true
#   # Base of the MCP port range: one server per developer that opted in, from here
#   # upward in the order they are declared below. Claude Code starts a stdio MCP server
#   # per session, so N sessions used to mean N copies of this process; over HTTP one
#   # process serves every session that developer runs. Per developer and not one for
#   # the box, because the server does the session's file I/O — an upload reads out of
#   # that developer's 0700 home, a screenshot is written back into it.
#   mcp_port: 9522
#   failover:
#     enabled: false
#     chrome_user: dev-a
#     cdp_port: 9222
#     fallback_chrome_port: 9422
#     client_tunnel_port: 9322

# ── Always-on Remote Control servers ──────────────────────────────────────────
# One per project: a tmux-hosted agent session your phone attaches to. Every project
# gets one unless it says otherwise — `remote_control: false` on a project turns that
# one off, and `enabled: false` here turns the whole box off.
#
# Everything an agent session spawns — shells, builds, MCP servers — lands in that
# session's unit cgroup, so this is where a runaway build is contained. Do not rely on
# developers[].resources for it: a slice ceiling sized near the host's RAM engages only
# once the whole box is already out of memory, which is far too late to help.
#
# Set these from measurement, not from a guess: read MemoryPeak off the running units
# (`systemctl show <unit> -p MemoryPeak`) and leave headroom above the ordinary peak.
# Every project inherits what is written here; a project that genuinely needs more
# declares its own under its `remote_control.resources`.
#
# The gap between memory_high and memory_max is also a kill-policy decision, not just
# a throttle band: a unit sitting between the two is under continuous reclaim, and that
# pressure propagates to the UID-owned user manager. Remote Control units are marked
# ManagedOOMPreference=avoid while the aggregate Codex host is omitted from pressure
# selection. If pressure lasts past host.oomd's memory_pressure_duration_sec, oomd can
# still select another eligible user-manager descendant. Keep memory_high close to
# memory_max: a narrow band trips the unit's own hard wall quickly and kills the build
# itself, while a wide one leaves the unit reclaim-thrashing long enough for oomd to
# sacrifice a neighbouring user service.
# remote_control:
#   spawn: worktree         # worktree | same-dir | session
#   capacity: 4             # parallel sessions per server
#   resources:
#     memory_high: 8G       # throttle here — reclaim starts, nothing dies yet
#     memory_max: 12G       # hard wall — the largest process in the unit is killed
#     memory_swap_max: 1G
#     cpu_weight: 80        # <100 yields to interactive shells under contention
#     nice: 5
#     oom_score_adjust: 300 # if the host ever runs out, kill builds before your shell
#     oom_policy: continue  # a killed build must not take the session set down with it
#   build_env: {}           # e.g. { NODE_OPTIONS: "--max-old-space-size=6144" }
#   resume:
#     max_concurrent: 2     # sessions warming at once after a reboot
#
# With `spawn: worktree` each session gets its own git worktree, and removing that
# worktree does not reap what the session started inside it: dev servers, bundler
# service processes and test runners keep running with a working directory that no
# longer exists, holding their heap until the box reboots. They accumulate quietly,
# and the failure they eventually cause does not look like a leak — the unit crosses
# memory_high, the kernel throttles the whole cgroup instead of killing anything, and
# every session in it stalls while the unit still reports "active (running)".
#
# The sweep only ever kills a process whose working directory is a DELETED worktree
# path, never an agent session, and only after it has been seen orphaned across a
# whole pass. Turn it off only if something else on the box already reaps them.
#   reap:
#     enabled: true
#     interval_sec: 900     # how often to sweep
#     grace_sec: 900        # how long a process must look orphaned before it is killed

# What the box hands a laptop. The CLI is published as a compiled binary per platform,
# so a developer needs neither this repo nor a Bun install — they run
# `ssh <you>@<box> 'devbox client-config --installer'` and read what it will do.
#
# Each target costs a ~60-90MB build on the machine running Ansible and one upload; the
# box only re-uploads when the CLI source actually changes. Trim the list to the
# platforms your developers are on, or set it to [] to publish none.
clients:
  cli_targets: [darwin-arm64, darwin-x64, linux-x64]   # linux-arm64 also available

developers:
  # ── A fully-featured developer, showing every override dimension ───────────
  - user: dev-a
    # true = the account already exists on the box; adopt it instead of failing.
    adopt_existing: true

    # Login keys are per developer: this is who may `ssh dev-a@box`.
    # Independent of the git keys below and of any agent OAuth session.
    login_ssh_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5REPLACEME dev-a@client"

    # Applied to the developer's whole systemd user slice — shells, editors,
    # rootless containers, agents and builds all count against these.
    resources:
      memory_high: 32GB
      memory_max: 40G
      cpu_weight: 100
      io_weight: 100

    # Codex Desktop aggregates every Codex project for this developer into one
    # code-mode host. Give only that host extra measured headroom without widening
    # any per-project Remote Control unit. Keep memory_high close to memory_max: this
    # host is omitted from parent-slice oomd selection so one pressure event cannot
    # kill every session; its own hard limit is therefore the containment boundary.
    codex_host_resources:
      memory_high: 12G
      memory_max: 16G
      memory_swap_max: 1G

    # The always-on Codex Remote Control daemon, off unless asked for. It is a second
    # Codex login rather than another view of the code-mode host: its own CODEX_HOME
    # under `.agent-profiles/codex-remote-control`, its own control socket. Declaring
    # it is what puts the heavy-job gate on its PATH — Codex hands a spawned command
    # `arg0-dir : codex-path : <inherited PATH>`, so a daemon started by hand resolves
    # bun/node/tsc straight from mise and queues on nothing. It shares the ceilings
    # above, because both daemons compete for the same machine.
    codex_remote_control: true

    # Run the Paseo daemon as a managed user service. Paseo has no unit of its own:
    # `paseo daemon start --foreground` keeps running wherever it was launched, so the
    # launcher owns the cgroup every Paseo/omp agent session ends up in. Start it by
    # hand over SSH and the whole fleet lands in that login session's scope — which
    # belongs to whoever logged in, carries no ceiling, and outlives the session as an
    # orphan. Neither `resources` above nor the heavy-job gate reaches it there.
    paseo_daemon: true

    # Required whenever paseo_daemon is set, and deliberately not inherited from
    # `remote_control.resources`: this one unit aggregates EVERY agent session the
    # developer runs, so the 12G default that suits a single project's session would
    # kill the whole fleet the first time the unit starts. Measure the idle fleet, then
    # leave a few GB of band above it — enough that one runaway build reaches the hard
    # wall and is killed alone, not so much that the fleet parks inside MemoryHigh and
    # throttles every session together.
    paseo_resources:
      memory_high: 40G
      memory_max: 44G
      memory_swap_max: 4G

    git_identities:
      work:
        name: "Dev A"
        email: "dev-a@example.com"
        github_user: dev-a-work
      personal:
        name: "Dev A"
        email: "dev-a@personal.example"
        github_user: dev-a-personal
    # Optional. With exactly one identity it is inferred; with several and no
    # default, a project that doesn't pick one is a validation ERROR (which is
    # what stops a silent push from the wrong account).
    default_git_identity: work

    # Optional per-developer override of host.heavy_job_gate.
    # heavy_job_gate:
    #   categories:
    #     test: false
    #   wait_timeout_sec: 900
    #   memory_max: 12G

    # Provider binaries shared by several profiles are pinned once per developer.
    # OMP rejects floating tags/ranges so a later `devbox apply` is a controlled upgrade.
    agent_versions:
      omp: "18.1.2"

    # Independent of git identity: one human can drive several agent logins.
    agent_profiles:
      claude-work:
        provider: claude
      claude-personal:
        provider: claude
        # An agent profile may pin its own memory space.
        memory_space: personal
      # One managed code-mode host per Linux user pre-owns the socket Codex Desktop
      # expects, so Desktop connects to the bounded host instead of launching an
      # unbounded transient process. It inherits `remote_control.resources`, then
      # applies this developer's optional `codex_host_resources` overrides.
      codex-work:
        provider: codex
      omp-work:
        provider: omp
        # Presets are inventory data, not extension source. `/preset <name>` changes
        # the whole built-in role map atomically inside the current OMP session;
        # `/preset reset` returns to OMP's normal settings. A resumed session restores
        # its own last choice, so one Paseo OMP provider can host all five strategies.
        omp_model_presets:
          default_preset: balanced
          aliases:
            codex: openai
            claude: anthropic
          presets:
            balanced:
              default: openai-codex/gpt-5.6-sol:medium
              smol: opencode-go/gpt-5.6-luna:medium
              slow: anthropic/claude-fable-5:xhigh
              vision: anthropic/claude-sonnet-5:high
              plan: anthropic/claude-opus-5:high
              designer: anthropic/claude-sonnet-5:high
              commit: opencode-go/gpt-5.6-luna:medium
              tiny: opencode-go/mimo-v2.5:low
              # No explicit effort: keep OMP's bundled task agent on auto thinking.
              task: openai-codex/gpt-5.6-terra
              advisor: anthropic/claude-opus-5:high
            openai:
              default: openai-codex/gpt-5.6-sol:medium
              smol: opencode-go/gpt-5.6-luna:medium
              slow: openai-codex/gpt-5.6-sol:xhigh
              vision: openai-codex/gpt-5.6-terra:high
              plan: openai-codex/gpt-5.6-sol:high
              designer: openai-codex/gpt-5.6-terra:high
              commit: opencode-go/gpt-5.6-luna:medium
              tiny: opencode-go/gpt-5.6-luna:low
              task: openai-codex/gpt-5.6-terra
              advisor: openai-codex/gpt-5.6-sol:high
            anthropic:
              default: anthropic/claude-opus-5:high
              smol: anthropic/claude-haiku-4-5:medium
              slow: anthropic/claude-fable-5:xhigh
              vision: anthropic/claude-sonnet-5:high
              plan: anthropic/claude-opus-5:high
              designer: anthropic/claude-sonnet-5:high
              commit: anthropic/claude-haiku-4-5:medium
              tiny: anthropic/claude-haiku-4-5:low
              task: anthropic/claude-sonnet-5
              advisor: anthropic/claude-opus-5:high
            opencode:
              default: opencode-go/deepseek-v4-pro:max
              smol: opencode-go/gpt-5.6-luna:medium
              slow: opencode-go/kimi-k3:max
              vision: opencode-go/deepseek-v4-flash-vision-exp:max
              plan: opencode-go/kimi-k3:max
              designer: opencode-go/kimi-k3:high
              commit: opencode-go/gpt-5.6-luna:medium
              tiny: opencode-go/mimo-v2.5:low
              task: opencode-go/deepseek-v4-flash:max
              advisor: opencode-go/kimi-k3:max
            cursor:
              default: cursor/composer-2.5:inherit
              smol: cursor/grok-4.6:high
              slow: cursor/claude-opus-5-thinking-xhigh:inherit
              vision: cursor/gemini-3.1-pro:high
              plan: cursor/claude-opus-5-high:inherit
              designer: cursor/claude-sonnet-5-high:inherit
              commit: cursor/composer-2.5:inherit
              tiny: cursor/gpt-5.4-nano:low
              task: cursor/gpt-5.6-terra
              advisor: cursor/claude-opus-5-high:inherit
          # OMP moves before the provider reaches zero, automatically returns after
          # cooldown, and keeps the expensive/economical model tiers aligned.
          retry:
            model_fallback: true
            usage_aware_fallback: true
            usage_reserve_pct: 1
            usage_reserve_policy: auto
            fallback_revert_policy: cooldown-expiry
            fallback_chains:
              openai-codex/gpt-5.6-sol:
                - anthropic/claude-opus-5:xhigh
                - opencode-zen/mimo-v2.5-free
              anthropic/claude-opus-5:
                - openai-codex/gpt-5.6-sol:high
                - opencode-zen/mimo-v2.5-free
              anthropic/claude-fable-5:
                - anthropic/claude-opus-5:xhigh
                - openai-codex/gpt-5.6-sol:xhigh
                - opencode-zen/mimo-v2.5-free
              openai-codex/gpt-5.6-terra:
                - anthropic/claude-sonnet-5
                - opencode-zen/mimo-v2.5-free
              anthropic/claude-sonnet-5:
                - openai-codex/gpt-5.6-terra
                - opencode-zen/mimo-v2.5-free
              openai-codex/gpt-5.6-luna:
                - anthropic/claude-haiku-4-5:medium
                - opencode-zen/mimo-v2.5-free
              anthropic/claude-haiku-4-5:
                - openai-codex/gpt-5.6-luna:medium
                - opencode-zen/mimo-v2.5-free
              opencode-go/deepseek-v4-pro:
                - openai-codex/gpt-5.6-sol:high
                - anthropic/claude-opus-5:high
                - opencode-zen/mimo-v2.5-free
              opencode-go/kimi-k3:
                - anthropic/claude-opus-5:xhigh
                - openai-codex/gpt-5.6-sol:xhigh
                - opencode-zen/mimo-v2.5-free
              opencode-go/deepseek-v4-flash:
                - openai-codex/gpt-5.6-terra
                - anthropic/claude-sonnet-5
                - opencode-zen/mimo-v2.5-free
              opencode-go/deepseek-v4-flash-vision-exp:
                - openai-codex/gpt-5.6-terra:high
                - anthropic/claude-sonnet-5:high
                - opencode-zen/mimo-v2.5-free
              opencode-go/gpt-5.6-luna:
                - openai-codex/gpt-5.6-luna:medium
                - anthropic/claude-haiku-4-5:medium
                - opencode-zen/mimo-v2.5-free
              opencode-go/mimo-v2.5:
                - openai-codex/gpt-5.6-luna:low
                - opencode-zen/mimo-v2.5-free
              cursor/composer-2.5:
                - cursor/grok-4.6
                - cursor/claude-opus-5-high
                - openai-codex/gpt-5.6-sol:medium
                - opencode-zen/mimo-v2.5-free
              cursor/grok-4.6:
                - cursor/composer-2.5
                - cursor/gpt-5.6-terra
                - opencode-zen/mimo-v2.5-free
              cursor/claude-opus-5-thinking-xhigh:
                - cursor/claude-opus-5-high
                - cursor/grok-4.6
                - anthropic/claude-opus-5:xhigh
                - opencode-zen/mimo-v2.5-free
              cursor/claude-opus-5-high:
                - cursor/grok-4.6
                - cursor/claude-sonnet-5-high
                - anthropic/claude-opus-5:high
                - opencode-zen/mimo-v2.5-free
              cursor/claude-sonnet-5-high:
                - cursor/gpt-5.6-terra
                - cursor/grok-4.6
                - anthropic/claude-sonnet-5:high
                - opencode-zen/mimo-v2.5-free
              cursor/gemini-3.1-pro:
                - cursor/claude-sonnet-5-high
                - cursor/grok-4.6
                - anthropic/claude-sonnet-5:high
                - opencode-zen/mimo-v2.5-free
              cursor/gpt-5.6-terra:
                - cursor/claude-sonnet-5-high
                - cursor/grok-4.6
                - openai-codex/gpt-5.6-terra
                - opencode-zen/mimo-v2.5-free
              cursor/gpt-5.4-nano:
                - cursor/grok-4.6
                - cursor/composer-2.5
                - opencode-zen/mimo-v2.5-free
    default_agent_profile: claude-work

    memory:
      enabled: true
      # By default every agent profile and project of THIS developer shares one
      # space. Memory is never shared between developers.
      default_space: shared
      instances:
        primary:
          engine: hindsight
          llm_provider: openrouter
          llm_model: openai/gpt-oss-20b
          # Name of an env var resolved from devbox.secrets.yml — never the key itself.
          api_key_env: OPENROUTER_API_KEY
      spaces:
        shared:
          instance: primary
          bank: dev-a-shared
        personal:
          instance: primary
          bank: dev-a-personal

    desktop:
      enabled: true
      environment: xfce
      transport: xrdp
      # How the desktop is reachable. Not exclusive — xrdp listens on each entry and the
      # client picks by which address it dials.
      #   tunnel         loopback only; reach it with `ssh -L 3389:127.0.0.1:3389 <box>`.
      #                  Nothing sees the RDP prompt without an SSH key first.
      #   tailnet        the box’s tailnet address; anyone on your tailnet can dial it.
      #   unsafe-public  every interface, including the public one. RDP authenticates
      #                  with a PAM password while every other door here is key-only —
      #                  the name is the warning. Cannot be combined with the others.
      access: [tunnel]
      # The session's keyboard, in XKB terms. Omit it and `devbox plan` detects the
      # keyboard of the machine it runs on and uses that — the right default for the
      # operator and a guess for everybody else, so state it per developer on a box with
      # more than one. The plan output says which of the two it used.
      #
      # This is not cosmetic: xrdp maps the layout id the client announces through its own
      # table, that table has holes (Turkish is one), and an unmapped id becomes `us` in
      # silence. The role teaches xrdp the layouts named here so the announcement lands.
      #   layout   XKB layout name — tr, us, de, gb …
      #   variant  optional — 'f' is the Turkish F keyboard, plain tr is the Q one
      keyboard:
        layout: tr
      idle_logout_minutes: 60
      # The port on YOUR machine that the always-on desktop tunnel listens on — the
      # address your RDP client dials. Defaults to 3389, then 3390 for the next
      # developer with a desktop. State it to pin the address for good.
      # client_port: 3389

    # Keep app connection records (FileZilla sites, ~/.ssh/config, DB clients) identical
    # on the client and the box. Needs file_bridge.sync_disk: true — the real files live
    # inside the sync disk; see docs/file-bridge.md#app-configs-connection-records.
    # file_bridge:
    #   sync_disk: true
    #   engine: mutagen          # mutagen (default) | syncthing
    #   # Client paths the box can see ON DEMAND, read-only, only while `devbox mount`
    #   # is running — nothing is copied and nothing persists. Independent of the sync
    #   # disk above; either can be used without the other. Each label becomes the box
    #   # directory ~/mnt/<label>, so labels must be filenames and must not repeat, and
    #   # two paths may not nest inside one another.
    #   lazy_mounts:
    #     - { label: desktop, path: "~/Desktop" }
    #   lazy_mount_on_connect: true   # bring them up on connect instead of on request
    # app_configs:
    #   enabled: true
    #   paths:
    #     - filezilla             # registry key: ~/.config/filezilla <-> box
    #     - ssh_config             # registry key: managed Include block in ~/.ssh/config
    #     - label: dbeaver         # custom entry: object form, any label
    #       client: "~/Library/DBeaverData/workspace6/General/.dbeaver"
    #       box: "~/.local/share/DBeaverData/workspace6/General/.dbeaver"
    #       mode: dir

    # A curated config tree on this client — skills, commands, mcp.json, statusline —
    # copied into this developer's agent config. Per developer on purpose: one shared
    # tree for everyone meant one person's personal skills landed in a colleague's
    # account. Credentials are never copied, and settings.json is machine-coupled, so
    # it stays out unless include_settings says otherwise.
    # agent_config:
    #   source: "claude-config/shared"   # absolute, ~-relative, or repo-relative
    #   include_settings: false

    # Wire the browser MCP servers into this developer's agent config.
    # browser: true

    projects:
      # Inherits every default: git=work, agent=claude-work, memory=shared,
      # engine=podman-rootless.
      - name: main-app
        repo: "git@github.com:example/main-app.git"
        branch: main
        ports: [3000]
        remote_control:
          name: "Main App"   # the title your phone shows
          capacity: 32

      # Different git account AND different agent login for the same human.
      - name: side-project
        repo: "git@github.com:example/side-project.git"
        git_identity: personal
        agent_profile: claude-personal
        memory_space: personal
        ports: [3001]

      # A project whose toolchain needs Docker specifically, and which nobody drives
      # from a phone — so it gets no Remote Control server at all.
      - name: legacy-service
        repo: "git@github.com:example/legacy-service.git"
        container_engine: docker-rootless
        remote_control: false

      # Memory off for this one project only; no containers either.
      - name: scratch
        repo: "git@github.com:example/scratch.git"
        memory_space: none
        container_engine: none
        install: false

  # ── A minimal developer: one identity, one agent, no memory, no desktop ────
  - user: dev-b
    login_ssh_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5REPLACEME dev-b@client"
    resources:
      memory_high: 50%
      memory_max: 75%
    # Sole identity and sole profile are selected automatically — no defaults needed.
    git_identities:
      work:
        name: "Dev B"
        email: "dev-b@example.com"
    agent_profiles:
      claude-main:
        provider: claude
    projects:
      - name: main-app
        repo: "git@github.com:example/main-app.git"
        ports: [4000]

# ── Weight-mode alternative ───────────────────────────────────────────────────
# Use this as a replacement for the direct `memory_high` values on every developer
# above; do not combine the two modes. The complete proportional allocation is:
#
# host:
#   memory_reserve: 4G
# developers:
#   - user: dev-a
#     resources:
#       memory_high: { weight: 1 }
#   - user: dev-b
#     resources:
#       memory_high: { weight: 5 }
